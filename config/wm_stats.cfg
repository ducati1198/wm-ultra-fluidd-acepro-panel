# ============================================================================
# wm_stats.cfg - counters, and the tool map for OrcaSlicer   *** UNTESTED ON A PRINTER ***
#
# Counters: every 2 s a small delayed macro compares WonderMaker's own save_variable `current_extruder`
# with the value it saw last time. A change means a tool change finished, so it adds 1 to
# `wm_stat_changes` and to `wm_stat_head<N>` (times toolhead N was picked up). Nothing in WonderMaker's
# macros is changed or wrapped. The Fluidd Toolheads card shows the numbers.
#   WM_STATS_RESET   sets all counters back to 0
#
# Tool map: WM_SET_TOOL_MAP MAP=0:2,1:3 [FILE=name.gcode] [KEEP_EXISTING=1]
#   Print tool T0 is printed with toolhead 2, T1 with toolhead 3 (toolhead numbers start at 0, like WonderMaker's
#   own `box_modify_t<N>` variables). The OrcaSlicer plugin writes this line at the top of the G-code, and the
#   Fluidd "Choose toolheads" window writes `wm_map_file`, so with KEEP_EXISTING=1 the Fluidd choice wins
#   for the same file.
# ============================================================================

[gcode_macro _WM_STATS]
variable_last: -1
gcode:

[delayed_gcode _WM_STATS_POLL]
initial_duration: 10
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set cur = sv.get('current_extruder', -1)|int %}
    {% set last = printer["gcode_macro _WM_STATS"].last|int %}
    {% if cur >= 0 and cur <= 3 and cur != last %}
        SET_GCODE_VARIABLE MACRO=_WM_STATS VARIABLE=last VALUE={cur}
        {% if last >= 0 %}
            SAVE_VARIABLE VARIABLE=wm_stat_changes VALUE={sv.get('wm_stat_changes', 0)|int + 1}
            SAVE_VARIABLE VARIABLE=wm_stat_head{cur} VALUE={sv.get('wm_stat_head' ~ cur, 0)|int + 1}
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_WM_STATS_POLL DURATION=2

[gcode_macro WM_STATS_RESET]
description: Set the tool-change counters back to 0
gcode:
    SAVE_VARIABLE VARIABLE=wm_stat_changes VALUE=0
    {% for h in range(4) %}
        SAVE_VARIABLE VARIABLE=wm_stat_head{h} VALUE=0
    {% endfor %}
    RESPOND MSG="Tool-change counters reset"

[gcode_macro WM_SET_TOOL_MAP]
description: WM_SET_TOOL_MAP MAP=0:2,1:3 [FILE=name] [KEEP_EXISTING=1] - print tool -> toolhead, for the next print
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set file = params.FILE|default('')|string %}
    {% set keep = params.KEEP_EXISTING|default(0)|int %}
    {% if keep == 1 and file != '' and sv.get('wm_map_file', '') == file %}
        RESPOND MSG="Tool map: keeping the choice made in Fluidd for {file}"
    {% else %}
        {% set ns = namespace(bad=0, pairs=[]) %}
        {% for item in (params.MAP|default('')|string).split(',') %}
            {% set kv = item.split(':') %}
            {% if kv|length == 2 and kv[0]|trim in ['0','1','2','3'] and kv[1]|trim in ['0','1','2','3'] %}
                {% set ns.pairs = ns.pairs + [[kv[0]|trim|int, kv[1]|trim|int]] %}
            {% elif item|trim != '' %}
                {% set ns.bad = 1 %}
            {% endif %}
        {% endfor %}
        {% if ns.bad == 1 %}
            { action_raise_error("WM_SET_TOOL_MAP: MAP must look like 0:2,1:3 (numbers 0 to 3)") }
        {% elif printer.print_stats.state == "paused" %}
            { action_raise_error("WM_SET_TOOL_MAP: not while a print is paused") }
        {% else %}
            {% for p in ns.pairs %}
                SAVE_VARIABLE VARIABLE=box_modify_t{p[0]} VALUE={p[1]}
                SAVE_VARIABLE VARIABLE=box_modify_t{p[0]}_backup VALUE={p[1]}
            {% endfor %}
            RESPOND MSG="Tool map set: {ns.pairs|map('join', '->')|join(', ')}"
        {% endif %}
    {% endif %}
