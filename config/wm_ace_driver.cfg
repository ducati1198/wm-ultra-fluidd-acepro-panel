# Minimal ACE driver config for the Ultra-S (single ACE Pro). DRAFT - untested.
# Do NOT include acepro.cfg / acepro_macros.cfg here: they define T0..T7, a cutter, a poop basket
# and other macros that conflict with WonderMaker's own T0..T3 and tool-change macros.
# [save_variables] is not repeated: WM's printer.cfg already has it.

# [respond] and [save_variables] already exist in WM's printer.cfg - do not repeat them here.

[virtual_pins]

[output_pin ACE_Pro]
pin: virtual_pin:ace_pro
pwm: False
value: 1
shutdown_value: 0

[ace]
ace_count: 1
# The printer owns T0..T3 (WonderMaker tool changes); the driver must not create them.
register_tool_commands: False
baud: auto
protocol: auto
# The driver expects these two sensors by name; they are only used by its own tool-change logic,
# which is not used here. Pointing them at WM's tool-0 sensors keeps the driver happy.
filament_runout_sensor_name_nozzle: filament0
filament_runout_sensor_name_rdm: path_0
feed_speed: 60
retract_speed: 50
max_dryer_temperature: 65
feed_assist_active_after_ace_connect: False
moonraker_lane_sync_enabled: False

[temperature_ace]

[temperature_sensor acepro_temp_1]
sensor_type: temperature_ace
ace_instance: 0
min_temp: 0
max_temp: 70
