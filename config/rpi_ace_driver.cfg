# rpi_ace_driver.cfg  -  ACE Pro driver settings for the WonderMaker ZR Ultra / Ultra-S on a Raspberry Pi (one ACE Pro)
#
# The ACE Pro is used as a feeder and a dryer only: slot N feeds tool head N (slot 1 = T0 ... slot 4 = T3).
# The printer keeps its own tool changes (T0..T3, four tool heads). The driver's colour-change system
# (its own T0..T7, cutter, poop basket, smart load and unload, runout swap) is not used.
# Do NOT include acepro.cfg / acepro_macros.cfg here: they define T0..T7, a cutter, a poop basket
# and other macros that conflict with WonderMaker's own T0..T3 and tool-change macros.

# ---- INDEX (auto, wm_cfg_index.py) ----
# rpi_ace_driver.cfg: 0 macros (0 visible in Fluidd, 0 hidden with a leading underscore)
# ---- END INDEX ----


# [respond] and [save_variables] already exist in WM's printer.cfg - do not repeat them here.

[virtual_pins]

[output_pin ACE_Pro]
pin: virtual_pin:ace_pro             # software switch, shown in Fluidd under Outputs
pwm: False                           # False = a plain on / off switch
value: 1                             # state at start: 1 = the ACE Pro is in use
shutdown_value: 0                    # state after a Klipper shutdown: 0 = off

# Shown by Fluidd in Outputs next to ACE Pro: 1 = start loading by itself when a spool is put in an ACE slot (kept over a restart by _wm_ace_watch)
[output_pin ACE_Auto_Load]
pin: virtual_pin:ace_auto_load       # software switch, shown in Fluidd under Outputs
pwm: False                           # False = a plain on / off switch
value: 1                             # state at start: 1 = auto load on (your saved choice is put back a few seconds later)

[ace]
ace_count: 1                         # number of ACE Pro units
register_tool_commands: False        # False = the driver makes no T0..T7, the printer keeps its own T0..T3
baud: auto                           # serial speed, auto = chosen for the ACE model
protocol: auto                       # auto = the driver finds out if it is an ACE 1 or an ACE 2
feed_speed: 60                       # mm/s  the driver's own feed speed (the macros in rpi_ace.cfg give theirs)
retract_speed: 50                    # mm/s  the driver's own retract speed
max_dryer_temperature: 65            # C  highest dryer temperature allowed
feed_assist_active_after_ace_connect: False  # False = feed assist is not switched on by itself when the ACE connects
moonraker_lane_sync_enabled: True    # True = the ACE slots (material, colour) are sent to Moonraker for OrcaSlicer's filament sync

[temperature_ace]

[temperature_sensor acepro_temp_1]
sensor_type: temperature_ace         # the temperature the ACE reports
ace_instance: 0                      # which ACE unit, 0 = the first
min_temp: 0                          # C  lowest reading that is accepted
max_temp: 70                         # C  highest reading that is accepted
