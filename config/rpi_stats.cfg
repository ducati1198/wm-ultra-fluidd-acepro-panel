# ============================================================================
# rpi_stats.cfg - counters, print time per toolhead, and the tool map for OrcaSlicer
#
# Counters: every 2 s a small delayed macro compares WonderMaker's own save_variable `current_extruder`
# with the value it saw last time. A change means a tool change finished, so it adds 1 to
# `wm_stat_changes` and to `wm_stat_head<N>` (times toolhead N was picked up). Nothing in WonderMaker's
# macros is changed or wrapped. The Fluidd Toolheads card shows the numbers.
# Print time per toolhead (1.10.0): while a print runs, the growth of print_stats.print_duration (pauses not counted)
# is added to the toolhead on the carriage, saved as `wm_stat_time<N>` (seconds) about once a minute, at a tool change
# and at the end of a print (so a power cut loses at most a minute).
# The poll only calls _WM_STATS_TICK: a macro reads the printer when it runs. A delayed_gcode's values are filled in
# when its timer fires and its commands may run minutes later behind START_PRINT (see B-040 in rpi_ace.cfg).
#   _WM_STATS_RESET   sets all counters and print times back to 0
#
# Tool map: WM_SET_TOOL_MAP MAP=0:2,1:3 [FILE=name.gcode] [KEEP_EXISTING=1]
#   Print tool T0 is printed with toolhead 2, T1 with toolhead 3 (toolhead numbers start at 0, like WonderMaker's
#   own `box_modify_t<N>` variables). The OrcaSlicer plugin writes this line at the top of the G-code, and the
#   Fluidd "Choose toolheads" window writes `wm_map_file`, so with KEEP_EXISTING=1 the Fluidd choice wins
#   for the same file.
# ============================================================================

# ---- INDEX (auto, wm_cfg_index.py) ----
# rpi_stats.cfg: 5 macros (2 visible in Fluidd, 3 hidden with a leading underscore)
# Visible:
#   _WM_STATS_RESET                     - Set the tool-change counters and the print time per toolhead back to 0
#   WM_SET_TOOL_MAP                    - WM_SET_TOOL_MAP MAP=0:2,1:3 [FILE=name] [KEEP_EXISTING=1] - print tool -> toolhead, for th
# Hidden helpers:
#   _WM_STATS                         
#   _WM_STATS_TICK                     - Counts tool changes and the print time of the toolhead on the carriage (called every 2 s b
#   _WM_STATS_POLL                    [delayed] 
# ---- END INDEX ----


[gcode_macro _WM_STATS]
variable_last: -1                # tool on the carriage seen at the last check, -1 = not read yet
variable_last_dur: -1.0          # print_stats.print_duration at the last check, -1 = no print running
variable_pend: 0.0               # print seconds not saved yet
variable_pend_tool: -1           # toolhead the unsaved seconds belong to
gcode:

[gcode_macro _WM_STATS_TICK]
description: Counts tool changes and the print time of the toolhead on the carriage (called every 2 s by _WM_STATS_POLL)
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set st = printer["gcode_macro _WM_STATS"] %}
    {% set cur = sv.get('current_extruder', -1)|int %}
    {% set last = st.last|int %}
    {% if cur >= 0 and cur <= 3 and cur != last %}
        SET_GCODE_VARIABLE MACRO=_WM_STATS VARIABLE=last VALUE={cur}
        {% if last >= 0 %}
            SAVE_VARIABLE VARIABLE=wm_stat_changes VALUE={sv.get('wm_stat_changes', 0)|int + 1}
            SAVE_VARIABLE VARIABLE=wm_stat_head{cur} VALUE={sv.get('wm_stat_head' ~ cur, 0)|int + 1}
        {% endif %}
    {% endif %}
    # ---- print time of the toolhead on the carriage
    {% set ps = printer.print_stats.state %}
    {% set dur = printer.print_stats.print_duration|float %}
    {% set running = ps in ["printing", "paused"] %}
    {% set add = (dur - st.last_dur) if (running and st.last_dur >= 0 and dur >= st.last_dur) else 0.0 %}
    {% set pend = st.pend|float %}
    {% set pt = st.pend_tool|int %}
    {% set tool_now = cur if (running and cur >= 0 and cur <= 3) else -1 %}
    # the unsaved seconds are saved when the toolhead changes, the print ends, or a minute has collected
    {% if pend >= 1 and pt >= 0 and (pt != tool_now or pend >= 60) %}
        SAVE_VARIABLE VARIABLE=wm_stat_time{pt} VALUE={sv.get('wm_stat_time' ~ pt, 0)|int + pend|round|int}
        {% set pend = 0.0 %}
    {% elif pt != tool_now %}
        {% set pend = 0.0 %}
    {% endif %}
    {% if tool_now >= 0 %}
        {% set pend = pend + add %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_STATS VARIABLE=pend VALUE={pend}
    SET_GCODE_VARIABLE MACRO=_WM_STATS VARIABLE=pend_tool VALUE={tool_now}
    SET_GCODE_VARIABLE MACRO=_WM_STATS VARIABLE=last_dur VALUE={dur if running else -1.0}

[delayed_gcode _WM_STATS_POLL]
initial_duration: 10             # s  first check this long after Klipper has started
gcode:
    _WM_STATS_TICK
    UPDATE_DELAYED_GCODE ID=_WM_STATS_POLL DURATION=2

[gcode_macro _WM_STATS_RESET]
description: Set the tool-change counters and the print time per toolhead back to 0
gcode:
    SAVE_VARIABLE VARIABLE=wm_stat_changes VALUE=0
    {% for h in range(4) %}
        SAVE_VARIABLE VARIABLE=wm_stat_head{h} VALUE=0
        SAVE_VARIABLE VARIABLE=wm_stat_time{h} VALUE=0
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_WM_STATS VARIABLE=pend VALUE=0.0
    RESPOND MSG="Tool-change counters and print times reset"

[gcode_macro WM_SET_TOOL_MAP]
description: WM_SET_TOOL_MAP MAP=0:2,1:3 [FILE=name] [KEEP_EXISTING=1] - print tool -> toolhead, for the next print
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set file = params.FILE|default('')|string %}
    {% set keep = params.KEEP_EXISTING|default(0)|int %}
    {% if keep == 1 and file != '' and sv.get('wm_map_file', '') == file %}
        RESPOND MSG="Tool map: keeping the choice made in Fluidd for {file}"
    {% else %}
        {% set ns = namespace(bad=0, pairs=[]) %}
        {% for item in (params.MAP|default('')|string).split(',') %}
            {% set kv = item.split(':') %}
            {% if kv|length == 2 and kv[0]|trim in ['0','1','2','3'] and kv[1]|trim in ['0','1','2','3'] %}
                {% set ns.pairs = ns.pairs + [[kv[0]|trim|int, kv[1]|trim|int]] %}
            {% elif item|trim != '' %}
                {% set ns.bad = 1 %}
            {% endif %}
        {% endfor %}
        {% if ns.bad == 1 %}
            { action_raise_error("WM_SET_TOOL_MAP: MAP must look like 0:2,1:3 (numbers 0 to 3)") }
        {% elif printer.print_stats.state == "paused" %}
            { action_raise_error("WM_SET_TOOL_MAP: not while a print is paused") }
        {% else %}
            {% for p in ns.pairs %}
                SAVE_VARIABLE VARIABLE=box_modify_t{p[0]} VALUE={p[1]}
                SAVE_VARIABLE VARIABLE=box_modify_t{p[0]}_backup VALUE={p[1]}
            {% endfor %}
            RESPOND MSG="Tool map set: {ns.pairs|map('join', '->')|join(', ')}"
        {% endif %}
    {% endif %}
