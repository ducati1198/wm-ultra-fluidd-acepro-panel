# ============================================================================
# wm_ace.cfg  -  Anycubic ACE Pro as feeder + dryer for the WonderMaker ZR Ultra-S
# DRAFT, NOT YET TESTED ON THE PRINTER. Needs the new main board + ACE connected.
#
# Wiring: ACE slot N tube -> hub inlet N -> toolhead N   (slot 1 = T0 ... slot 4 = T3)
# Uses only WM's existing sensors:  path_N (hub inlet)  and  filament<N> (on the toolhead).
# Does NOT redefine any WM macro. Does NOT use the ACE driver's T0..T7 tool-change logic.
# ============================================================================

# ---------------------------------------------------------------- settings
[gcode_macro _WM_ACE]
variable_ace_instance: 0
# --- distances (mm) - measure your tubes, then tune with test feeds
variable_max_total_mm: 4000      # absolute safety limit for one load
variable_hub_to_head_mm: 900     # hub inlet -> toolhead sensor (slow phase length limit)
variable_tail_mm: 1800           # retract distance after the path sensor clears (hub -> back inside ACE)
variable_fast_speed: 60          # mm/s  ACE -> hub
variable_slow_speed: 20          # mm/s  hub -> toolhead (small overshoot after sensor trips)
variable_retract_speed: 50
variable_tick_s: 0.3             # how often the sensors are polled while moving
variable_fast_timeout_s: 90
variable_slow_timeout_s: 60
variable_auto: 1                 # 1 = start loading when a spool is put in the ACE slot
# --- runtime state (do not edit)
variable_mode: "idle"            # idle | load_fast | load_slow | unload_hub | unload_tail
variable_tool: -1
variable_ticks: 0
variable_assist: -1
variable_prev: ""
variable_baselined: 0
gcode:

# ---------------------------------------------------------------- helpers
[gcode_macro _WM_ACE_FINISH]
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0

[gcode_macro _WM_ACE_FAIL]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_STOP_FEED T={w.tool}
    ACE_STOP_RETRACT T={w.tool}
    RESPOND TYPE=error MSG="ACE: {params.MSG|default('failed')} (tool T{w.tool})"
    _WM_ACE_FINISH

# ---------------------------------------------------------------- LOAD
[gcode_macro ACE_WM_LOAD]
description: Feed ACE slot T (0-3) to the hub, then to the toolhead sensor. WM's own insert routine then takes over.
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_LOAD: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("ACE_WM_LOAD: not while printing")}
    {% elif printer["filament_switch_sensor filament" ~ t].filament_detected %}
        RESPOND MSG="ACE: filament already at toolhead T{t}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_fast"'
        RESPOND MSG="ACE: feeding slot {t+1} to hub..."
        ACE_FEED T={t} LENGTH={w.max_total_mm} SPEED={w.fast_speed}
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

# ---------------------------------------------------------------- UNLOAD
[gcode_macro ACE_WM_RETRACT]
description: ACE pulls filament T back until the hub sensor clears, then into the ACE (run after WM's UNLOAD_FILAMENT).
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_RETRACT: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"unload_hub"'
        ACE_RETRACT T={t} LENGTH={w.max_total_mm} SPEED={w.retract_speed}
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

[gcode_macro ACE_WM_UNLOAD]
description: Full unload of tool T: WM's UNLOAD_FILAMENT (extruder), then the ACE retracts the filament.
gcode:
    {% set t = params.T|default(-1)|int %}
    UNLOAD_FILAMENT T={t}
    M400
    ACE_WM_RETRACT T={t}

[gcode_macro ACE_WM_STOP]
description: Emergency stop of any ACE feed/retract started by these macros.
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% for i in range(4) %}
        ACE_STOP_FEED T={i}
        ACE_STOP_RETRACT T={i}
    {% endfor %}
    _WM_ACE_FINISH
    RESPOND MSG="ACE: stopped"

# ---------------------------------------------------------------- sensor poll (state machine)
[delayed_gcode _wm_ace_tick]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set t = w.tool %}
    {% set mode = w.mode %}
    {% if mode != "idle" and t >= 0 %}
        {% set head = printer["filament_switch_sensor filament" ~ t].filament_detected %}
        {% set hub = printer["filament_switch_sensor path_" ~ t].filament_detected %}
        {% set secs = (w.ticks + 1) * w.tick_s %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE={w.ticks + 1}
        {% if mode == "load_fast" %}
            {% if head %}
                ACE_STOP_FEED T={t}
                RESPOND MSG="ACE: filament at toolhead T{t}"
                _WM_ACE_FINISH
            {% elif hub %}
                ACE_STOP_FEED T={t}
                RESPOND MSG="ACE: filament at hub, creeping to toolhead..."
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_slow"'
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
                ACE_FEED T={t} LENGTH={w.hub_to_head_mm} SPEED={w.slow_speed}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% elif secs > w.fast_timeout_s %}
                _WM_ACE_FAIL MSG="hub sensor never triggered - check slot/tube"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "load_slow" %}
            {% if head %}
                ACE_STOP_FEED T={t}
                RESPOND MSG="ACE: filament at toolhead T{t}"
                _WM_ACE_FINISH
            {% elif secs > w.slow_timeout_s %}
                _WM_ACE_FAIL MSG="toolhead sensor never triggered - check tube"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "unload_hub" %}
            {% if not hub %}
                ACE_STOP_RETRACT T={t}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"unload_tail"'
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
                ACE_RETRACT T={t} LENGTH={w.tail_mm} SPEED={w.retract_speed}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% elif secs > w.fast_timeout_s %}
                _WM_ACE_FAIL MSG="hub sensor never cleared"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "unload_tail" %}
            {% if secs > (w.tail_mm / w.retract_speed) + 3 %}
                RESPOND MSG="ACE: tool T{t} unloaded"
                _WM_ACE_FINISH
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------- feed assist + auto load (1 s watcher, no WM macro edited)
[delayed_gcode _wm_ace_watch]
initial_duration: 10
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% if inst in printer %}
        {% set printing = (printer.print_stats.state == "printing") %}
        # ---- feed assist follows the active tool, only while printing
        {% if w.mode == "idle" %}
            {% set active = printer.toolhead.extruder %}
            {% set tn = 0 if active == "extruder" else active[8:]|int %}
            {% set want = tn if printing else -1 %}
            {% if want != w.assist %}
                {% if w.assist >= 0 %}
                    ACE_DISABLE_FEED_ASSIST T={w.assist}
                {% endif %}
                {% if want >= 0 %}
                    ACE_ENABLE_FEED_ASSIST T={want}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE={want}
            {% endif %}
        {% endif %}
        # ---- auto load when a spool is put in a slot (slot status becomes "ready")
        {% set cur = [] %}
        {% for i in range(4) %}
            {% set _ = cur.append(printer[inst].slots[i].status|string) %}
        {% endfor %}
        {% set prev = w.prev.split(",") if w.prev else [] %}
        {% if w.baselined and w.auto and w.mode == "idle" and not printing and prev|length == 4 %}
            {% set ns = namespace(go=-1) %}
            {% for i in range(4) %}
                {% if ns.go < 0 and prev[i] != "ready" and cur[i] == "ready" %}
                    {% if not printer["filament_switch_sensor filament" ~ i].filament_detected %}
                        {% set ns.go = i %}
                    {% endif %}
                {% endif %}
            {% endfor %}
            {% if ns.go >= 0 %}
                RESPOND MSG="ACE: spool detected in slot {ns.go + 1}, loading T{ns.go}"
                ACE_WM_LOAD T={ns.go}
            {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=prev VALUE='"{cur|join(",")}"'
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=baselined VALUE=1
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_wm_ace_watch DURATION=1

[gcode_macro ACE_WM_AUTO]
description: ACE_WM_AUTO ENABLE=1|0 - auto load when a spool is inserted
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=auto VALUE={params.ENABLE|default(1)|int}
    RESPOND MSG="ACE auto-load: {'on' if params.ENABLE|default(1)|int else 'off'}"

# ---------------------------------------------------------------- dryer (Fluidd buttons)
[gcode_macro ACE_WM_DRY_START]
description: Start drying. TEMP (deg C, max 65) and DURATION (same unit as ACE_START_DRYING)
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_START_DRYING INSTANCE={w.ace_instance} TEMP={params.TEMP|default(50)|int} DURATION={params.DURATION|default(240)|int}

[gcode_macro ACE_WM_DRY_STOP]
description: Stop drying
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_STOP_DRYING INSTANCE={w.ace_instance}
