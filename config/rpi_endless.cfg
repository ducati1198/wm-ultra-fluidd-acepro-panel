# ============================================================================
# rpi_endless.cfg - ENDLESS SPOOL for the WonderMaker ZR Ultra-S   *** EXPERIMENTAL ***
#
# When a toolhead runs out during a print, WM's own macros pause the print. If another toolhead holds
# the SAME material and colour (as saved for the Toolheads card: zr_tN_mat, zr_tN_color) and has filament,
# it takes over: _WM_ENDLESS_CONTINUE FROM=<empty head> TO=<spare head>. A set can be 2, 3 or 4 toolheads;
# the next one in number order takes over, after the highest it starts again from the lowest.
#
# With "Swap automatically" on (_WM_ENDLESS_SET AUTO=1, the default) the printer does this by itself:
# _WM_ENDLESS_WATCH looks every few seconds; a paused print with an empty toolhead on the carriage starts the swap.
# The toolhead's own filament sensor (filamentN) says empty. The hub sensors (path_N) are TANGLE sensors: they fire when the
# filament is pulled tight (a tangle, or a finished spool whose end is fixed to the spool) and pause the print (hub.cfg). With
# "Swap on a tangle" on (_WM_ENDLESS_SET TANGLE=1, the default) a tangle starts a swap too, and the tangled toolhead is out of
# the line until _WM_ENDLESS_FIXED T=n (Fixed button), a reload of its filament, or the end of the print.
# With an ACE Pro connected, a spare must also have filament in its ACE slot. Without an ACE only the toolhead sensors count.
# With it off the print stays paused and the Fluidd Toolheads card offers the spare.
#
# How the swap works: (1) WM's _CHANGE_TOOL from the park position (the empty, cold head never goes back to the part),
# (2) the resume temperature of the empty head is given to the spare head and the tool mapping of the print
# (box_modify_tN_backup) is pointed at it, (3) WM's RESUME heats, purges and wipes at the wipe area, returns to the saved
# print position; (4) _WM_ENDLESS_4 moves the spare head by the difference between the offsets of the two heads,
# because RESTORE_GCODE_STATE returns to the machine position of the old head and keeps the offsets of the new one.
#
# Nothing here changes any WM macro. Off by default (Fluidd switch or _WM_ENDLESS_SET ENABLE=1).
# ============================================================================

# ---- INDEX (auto, wm_cfg_index.py) ----
# rpi_endless.cfg: 11 macros (4 visible in Fluidd, 7 hidden with a leading underscore)
# Visible:
#   _WM_ENDLESS_SET                     - _WM_ENDLESS_SET ENABLE=1|0 AUTO=1|0 TANGLE=1|0 - endless spool, swap automatically, swap on
#   _WM_ENDLESS_FIXED                   - _WM_ENDLESS_FIXED T=0 - the spool of this toolhead is free or replaced after a tangle: it m
#   _WM_ENDLESS_PLAN                    - _WM_ENDLESS_PLAN - shows the sets of identical toolheads and who takes over for whom, moves
#   _WM_ENDLESS_CONTINUE                - _WM_ENDLESS_CONTINUE FROM= TO= - while PAUSED: swap the empty head FROM for the loaded head
# Hidden helpers:
#   _WM_ENDLESS                       
#   _WM_ENDLESS_TANGLE                 - Called by the tangle sensors (hub.cfg, path_N) after they paused the print: remembers whic
#   _WM_ENDLESS_WATCH                 [delayed] 
#   _WM_ENDLESS_TICK                   - Called every 3 s by _WM_ENDLESS_WATCH: a paused print whose toolhead is empty or tangled g
#   _WM_ENDLESS_PROMPT_CLOSE          
#   _WM_ENDLESS_3                     
#   _WM_ENDLESS_4                      - After RESUME: put the nozzle of the spare head exactly where the nozzle of the empty head 
# ---- END INDEX ----


[gcode_macro _WM_ENDLESS]
variable_from: -1                # toolhead that ran out in the last swap, -1 = none
variable_to: -1                  # toolhead that took over
variable_swap_file: ""           # print file of the last swap (the Fluidd card shows the swap only for this file)
variable_tried: 0                # 1 = the watcher already handled the pause that is running
variable_ofx: 0.0                 # G-code offsets of the empty head at the pause (X Y Z), read before the tool change
variable_ofy: 0.0  # G-code Y offset of the empty head at the pause
variable_ofz: 0.0  # G-code Z offset of the empty head at the pause
variable_ocx: 0.0                 # G-code offsets of the spare head right after the tool change
variable_ocy: 0.0  # G-code Y offset of the spare head right after the tool change
variable_ocz: 0.0  # G-code Z offset of the spare head right after the tool change
variable_pending: 0              # 1 = a swap is waiting for its last step (_WM_ENDLESS_4)
variable_swap_purge: 20            # mm  F-202: purge length of the resume after a swap (the spare head filament was never pushed, B-079). RESUME alone purges 20 mm
variable_keeps: 1                # 1 = RESTORE_GCODE_STATE keeps the offsets of the head on the carriage (WonderMaker's Klipper, and upstream Klipper with wm_gcode_compat)
variable_tangle: -1               # toolhead whose tangle sensor (hub.cfg, path_N) fired in the pause that is running, -1 = none
variable_out0: 0                 # 1 = toolhead 0 tangled and is out of the line (not used as a spare) until _WM_ENDLESS_FIXED T=0,
variable_out1: 0                 #     a reload of its filament, or the end of the print. 2 = out and seen empty (reload running)
variable_out2: 0  # 1 = toolhead 2 tangled and is out of the line, 2 = out and seen empty (see out0)
variable_out3: 0  # 1 = toolhead 3 tangled and is out of the line, 2 = out and seen empty (see out0)
variable_fake: -1                # test only: treat this toolhead as empty (SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=fake VALUE=0)
gcode:

[gcode_macro _WM_ENDLESS_SET]
description: _WM_ENDLESS_SET ENABLE=1|0 AUTO=1|0 TANGLE=1|0 - endless spool, swap automatically, swap on a tangle (all saved on the printer)
gcode:
    {% set sv = printer.save_variables.variables %}
    {% if params.ENABLE is defined %}
        SAVE_VARIABLE VARIABLE=wm_endless VALUE={1 if params.ENABLE|int else 0}
    {% endif %}
    {% if params.AUTO is defined %}
        SAVE_VARIABLE VARIABLE=wm_endless_auto VALUE={1 if params.AUTO|int else 0}
    {% endif %}
    {% if params.TANGLE is defined %}
        SAVE_VARIABLE VARIABLE=wm_endless_tangle VALUE={1 if params.TANGLE|int else 0}
    {% endif %}
    {% set e = (params.ENABLE|int) if params.ENABLE is defined else sv.wm_endless|default(0)|int %}
    {% set a = (params.AUTO|int) if params.AUTO is defined else sv.wm_endless_auto|default(1)|int %}
    {% set t = (params.TANGLE|int) if params.TANGLE is defined else sv.wm_endless_tangle|default(1)|int %}
    RESPOND MSG="Endless spool: {'on' if e else 'off'}, swap automatically: {'on' if a else 'off'}, swap on a tangle: {'on' if t else 'off'}"

[gcode_macro _WM_ENDLESS_TANGLE]
description: Called by the tangle sensors (hub.cfg, path_N) after they paused the print: remembers which toolhead tangled
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t >= 0 and t <= 3 and printer.print_stats.state in ["printing", "paused"] %}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=tangle VALUE={t}
    {% endif %}

[gcode_macro _WM_ENDLESS_FIXED]
description: _WM_ENDLESS_FIXED T=0 - the spool of this toolhead is free or replaced after a tangle: it may take over again
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("_WM_ENDLESS_FIXED: T must be 0-3")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=out{t} VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="Endless spool: T{t + 1} is back in the line"

[gcode_macro _WM_ENDLESS_PLAN]
description: _WM_ENDLESS_PLAN - shows the sets of identical toolheads and who takes over for whom, moves nothing
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set ns = namespace(txt=[]) %}
    {% for h in range(4) %}
        {% set s = namespace(nxt=[]) %}
        {% for k in range(1, 4) %}
            {% set c = (h + k) % 4 %}
            {% if sv.get('zr_t' ~ h ~ '_mat') is not none and sv.get('zr_t' ~ c ~ '_mat') == sv.get('zr_t' ~ h ~ '_mat') and sv.get('zr_t' ~ c ~ '_color') is not none and sv.get('zr_t' ~ c ~ '_color') == sv.get('zr_t' ~ h ~ '_color') %}
                {% set s.nxt = s.nxt + ['T' ~ c] %}
            {% endif %}
        {% endfor %}
        {% set ns.txt = ns.txt + ['T' ~ h ~ ' -> ' ~ (s.nxt|join(', ') if s.nxt else 'no spare')] %}
    {% endfor %}
    RESPOND MSG="Endless spool ({'on' if sv.wm_endless|default(0)|int else 'off'}, automatic {'on' if sv.wm_endless_auto|default(1)|int else 'off'}): {ns.txt|join(' / ')}. On the carriage: {sv.get('current_extruder', '?')}, print: {printer.print_stats.state}"

[delayed_gcode _WM_ENDLESS_WATCH]
initial_duration: 8
gcode:
    _WM_ENDLESS_TICK
    UPDATE_DELAYED_GCODE ID=_WM_ENDLESS_WATCH DURATION=3

[gcode_macro _WM_ENDLESS_TICK]
description: Called every 3 s by _WM_ENDLESS_WATCH: a paused print whose toolhead is empty or tangled gets its identical spare
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set w = printer["gcode_macro _WM_ENDLESS"] %}
    {% set st = printer.print_stats.state %}
    # ---- a toolhead that is out of the line after a tangle comes back when it was reloaded, and when the print is over
    {% for n in range(4) %}
        {% set det = printer['filament_switch_sensor filament' ~ n].filament_detected %}
        {% if w['out' ~ n]|int != 0 and st not in ["printing", "paused"] %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=out{n} VALUE=0
        {% elif w['out' ~ n]|int == 1 and det != True %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=out{n} VALUE=2
        {% elif w['out' ~ n]|int == 2 and det == True %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=out{n} VALUE=0
            RESPOND MSG="Endless spool: T{n + 1} was reloaded and is back in the line"
        {% endif %}
    {% endfor %}
    {% if st != "paused" %}
        {% if w.tried|int != 0 %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=tried VALUE=0
        {% endif %}
        {% if w.tangle|int >= 0 %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=tangle VALUE=-1
        {% endif %}
        {% if st == "printing" and printer.print_stats.print_duration < 15 and w.from|int >= 0 and w.swap_file != printer.print_stats.filename %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=from VALUE=-1
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=to VALUE=-1
        {% endif %}
    {% elif w.tried|int == 0 and sv.wm_endless|default(0)|int == 1 and sv.wm_endless_auto|default(1)|int == 1 and ("gcode_macro _WM_PAUSE_STATE" not in printer or printer["gcode_macro _WM_PAUSE_STATE"].active|int == 1) %}
        {% set cur = sv.current_extruder|default(99)|int %}
        {% set ns = namespace(empty=0, tangled=0, spare=-1) %}
        {% if cur >= 0 and cur < 4 %}
            {% if w.fake|int == cur or printer['filament_switch_sensor filament' ~ cur].filament_detected != True %}
                {% set ns.empty = 1 %}
            {% elif w.tangle|int == cur and sv.wm_endless_tangle|default(1)|int == 1 %}
                {% set ns.tangled = 1 %}
            {% endif %}
        {% endif %}
        {% if ns.empty == 1 or ns.tangled == 1 %}
            SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=tried VALUE=1
            # an ACE that is connected and in use: a spare must have filament in its ACE slot too (slot N feeds toolhead N)
            {% set an = "ace_instance_" ~ (printer["gcode_macro _WM_ACE"].ace_instance if "gcode_macro _WM_ACE" in printer else 0) %}
            {% set ace = printer[an] if (an in printer and printer[an].connection_state == "connected" and sv.ace_global_enabled|default(True) != False) else none %}
            {% for k in range(1, 4) %}
                {% set c = (cur + k) % 4 %}
                {% if ns.spare < 0 and w.fake|int != c and w['out' ~ c]|int == 0
                      and sv.get('zr_t' ~ cur ~ '_mat') is not none and sv.get('zr_t' ~ c ~ '_mat') == sv.get('zr_t' ~ cur ~ '_mat')
                      and sv.get('zr_t' ~ cur ~ '_color') is not none and sv.get('zr_t' ~ c ~ '_color') == sv.get('zr_t' ~ cur ~ '_color')
                      and printer['filament_switch_sensor filament' ~ c].filament_detected == True
                      and (ace is none or ace.slots[c].status != "empty") %}
                    {% set ns.spare = c %}
                {% endif %}
            {% endfor %}
            {% if ns.spare >= 0 and ns.tangled == 1 %}
                SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=out{cur} VALUE=1
                RESPOND MSG="Endless spool: T{cur + 1} tangled or its spool ended. T{ns.spare + 1} has the same material and colour and takes over"
                RESPOND TYPE=command MSG="action:prompt_end"
                RESPOND TYPE=command MSG="action:prompt_begin Endless spool"
                RESPOND TYPE=command MSG="action:prompt_text T{cur + 1}: tangle or spool end."
                RESPOND TYPE=command MSG="action:prompt_text T{ns.spare + 1} takes over and the print goes on."
                RESPOND TYPE=command MSG="action:prompt_text Free or replace the spool of T{cur + 1}, then press Fixed. Until then T{cur + 1} is not used as a spare."
                RESPOND TYPE=command MSG="action:prompt_footer_button Fixed|_WM_ENDLESS_FIXED T={cur}|primary"
                RESPOND TYPE=command MSG="action:prompt_footer_button Close|_WM_ENDLESS_PROMPT_CLOSE"
                RESPOND TYPE=command MSG="action:prompt_show"
                _WM_ENDLESS_CONTINUE FROM={cur} TO={ns.spare}
            {% elif ns.spare >= 0 %}
                RESPOND MSG="Endless spool: T{cur + 1} is empty. T{ns.spare + 1} has the same material and colour and takes over"
                _WM_ENDLESS_CONTINUE FROM={cur} TO={ns.spare}
            {% elif ns.tangled == 1 %}
                RESPOND MSG="Endless spool: T{cur + 1} tangled or its spool ended and no toolhead with the same material and colour is ready. The print stays paused"
            {% else %}
                RESPOND MSG="Endless spool: T{cur + 1} is empty and no toolhead with the same material and colour is ready. The print stays paused"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _WM_ENDLESS_PROMPT_CLOSE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _WM_ENDLESS_CONTINUE]
description: _WM_ENDLESS_CONTINUE FROM= TO= - while PAUSED: swap the empty head FROM for the loaded head TO and resume
gcode:
    {% set f = params.FROM|default(-1)|int %}
    {% set t = params.TO|default(-1)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set ns = namespace(n=0) %}
    {% for L in range(4) %}
        {% if sv.get('box_modify_t' ~ L ~ '_backup', L)|int == f %}
            {% set ns.n = ns.n + 1 %}
        {% endif %}
    {% endfor %}
    {% if printer.print_stats.state != "paused" %}
        {action_raise_error("Endless spool: the print must be paused")}
    {% elif f < 0 or f > 3 or t < 0 or t > 3 or f == t %}
        {action_raise_error("Endless spool: FROM and TO must be two different tools (0-3)")}
    {% elif ns.n == 0 %}
        {action_raise_error("Endless spool: no tool of this print uses T" ~ (f + 1))}
    {% elif printer['filament_switch_sensor filament' ~ t].filament_detected != True %}
        {action_raise_error("Endless spool: T" ~ (t + 1) ~ " has no filament")}
    {% elif sv.get('current_extruder', -1)|int != f %}
        {action_raise_error("Endless spool: T" ~ (f + 1) ~ " is not the tool on the carriage")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=tried VALUE=1
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=from VALUE={f}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=to VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=swap_file VALUE="'{printer.print_stats.filename|replace("'", "")|replace('"', '')}'"
        {% set o = printer.gcode_move.homing_origin %}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=ofx VALUE={o.x}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=ofy VALUE={o.y}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=ofz VALUE={o.z}
        RESPOND MSG="Endless spool: T{f + 1} -> T{t + 1}. Changing tools from the park position"
        _CHANGE_TOOL T={t}
        _WM_ENDLESS_3
    {% endif %}

[gcode_macro _WM_ENDLESS_3]
gcode:
    {% set w = printer["gcode_macro _WM_ENDLESS"] %}
    {% set f = w.from %}
    {% set t = w.to %}
    {% set sv = printer.save_variables.variables %}
    {% set temp = printer["gcode_macro RESUME"]["resume_temperature" ~ f]|float %}
    {% if sv.get('current_extruder', -1)|int != t %}
        {action_raise_error("Endless spool: changing to T" ~ (t + 1) ~ " failed. The print stays paused.")}
    {% elif temp < 150 %}
        {action_raise_error("Endless spool: no valid resume temperature for T" ~ (f + 1) ~ ". The print stays paused.")}
    {% else %}
        {% set o = printer.gcode_move.homing_origin %}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=ocx VALUE={o.x}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=ocy VALUE={o.y}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=ocz VALUE={o.z}
        # RESUME heats heads by number and restores the tool mapping from the *_backup variables
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature{t} VALUE={temp}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature{f} VALUE=0
        {% for L in range(4) %}
            {% if sv.get('box_modify_t' ~ L ~ '_backup', L)|int == f %}
                SAVE_VARIABLE VARIABLE=box_modify_t{L}_backup VALUE={t}
            {% endif %}
        {% endfor %}
        RESPOND MSG="Endless spool: continuing the print with T{t + 1} ({temp|int} C). One purge and wipe at the wipe area, then back to the print"
        # RESUME: heat, purge, wipe, RESTORE_GCODE_STATE NAME=PAUSE (position and offsets of the old head), then the offsets of the new head
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=pending VALUE=1
        # F-177: RESUME picks up wm_pause_tool: it must be the NEW tool, or RESUME changes back to the empty head
        SAVE_VARIABLE VARIABLE=wm_pause_tool VALUE={t}
        # F-202: the spare head has not pushed filament yet (B-079: it can sit at the head sensor only), so the purge of this resume is longer than the usual 20 mm. RESUME reads it from _WM_RTOOL.purge
        {% if "gcode_macro _WM_RTOOL" in printer and w.swap_purge|default(50)|float > printer["gcode_macro _WM_RTOOL"].purge|default(20)|float %}
            SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=purge VALUE={w.swap_purge|default(50)|int}
            RESPOND MSG="Endless spool: T{t + 1} purges {w.swap_purge|default(50)|int} mm before the print goes on"
        {% endif %}
        RESUME
        {% if "gcode_macro _WM_RTOOL" in printer %}
            SET_GCODE_VARIABLE MACRO=_WM_RTOOL VARIABLE=purge VALUE=20
        {% endif %}
        _WM_ENDLESS_4
    {% endif %}

[gcode_macro _WM_ENDLESS_4]
description: After RESUME: put the nozzle of the spare head exactly where the nozzle of the empty head stopped
gcode:
    {% set w = printer["gcode_macro _WM_ENDLESS"] %}
    {% if w.pending|int == 1 %}
        # no test of the print state here: right after RESUME (M24) Klipper still reports "paused"
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=pending VALUE=0
        {% if "gcode_macro _WM_LIVEZ" not in printer %}
            _OFFSET_SET
        {% endif %}
        {% if w.keeps|int == 1 %}
            # RESUME returned to the machine position of the empty head and kept the offsets the spare head had after the tool change.
            # The difference between the two sets of offsets is the distance still to go (X and Y, and Z until the next layer).
            {% set dx = (w.ofx - w.ocx)|round(4) %}
            {% set dy = (w.ofy - w.ocy)|round(4) %}
            {% set dz = (w.ofz - w.ocz)|round(4) %}
            RESPOND MSG="Endless spool: moving T{w.to + 1} onto the print position (X{0 - dx} Y{0 - dy} Z{0 - dz} mm)"
            SAVE_GCODE_STATE NAME=_wm_endless
            G91
            G1 X{0 - dx} Y{0 - dy} Z{0 - dz} F600
            RESTORE_GCODE_STATE NAME=_wm_endless
        {% endif %}
    {% endif %}
