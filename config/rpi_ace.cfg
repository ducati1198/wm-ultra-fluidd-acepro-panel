# ============================================================================
# rpi_ace.cfg  -  Anycubic ACE Pro as feeder + dryer for the WonderMaker ZR Ultra-S
# Load and unload tested on the printer (T0-T3). The grab push and feed-assist-off at the end of a load are not yet tested.
#
# Wiring: ACE slot N tube -> hub inlet N -> toolhead N   (slot 1 = T0 ... slot 4 = T3)
# Uses only the tool head sensor filament<N>. The hub sensors path_N are NOT filament sensors on this printer (they always
# read on), so nothing here reads them. The ACE driver is given no sensor (see rpi_ace_driver.cfg), so it never switches one off.
# A load feeds fast until slow_tail_mm before the tool head, then slow until the tool head sensor sees the filament. The tube
# length of each tool is measured by the first load (which runs slow) and saved as wm_ace_len_t0 .. wm_ace_len_t3.
# Does NOT redefine any WM macro. Does NOT use the ACE driver's T0..T7 tool-change logic: of the driver only
# feed, retract, feed assist and drying are used.
# ============================================================================

# ---- INDEX (auto, wm_cfg_index.py) ----
# rpi_ace.cfg: 25 macros (9 visible in Fluidd, 16 hidden with a leading underscore)
# Visible:
#   SET_GCODE_OFFSET                  
#   ACE_WM_LOAD                        - Feed ACE slot T (0-3) to the tool head sensor, fast first when the tube length is known. W
#   _ACE_WM_RETRACT                     - ACE pulls filament T back into the ACE until the tool head sensor is clear and the ACE slo
#   ACE_WM_UNLOAD                      - Full unload of tool T with a formed tip. Homes and picks up the tool by itself, then the e
#   ACE_WM_STOP                        - Emergency stop of any ACE feed/retract started by these macros.
#   _ACE_WM_ASSIST                      - _ACE_WM_ASSIST T=0-3 STATE=on|off|toggle - feed assist of one tool by hand. Stays until the
#   _ACE_WM_AUTO                        - _ACE_WM_AUTO ENABLE=1|0 - auto load when a spool is inserted
#   _ACE_WM_DRY_START                   - Start drying. TEMP (deg C, max 65) and DURATION (same unit as ACE_START_DRYING)
#   _ACE_WM_DRY_STOP                    - Stop drying
# Hidden helpers:
#   _WM_ACE                           
#   _WM_ACE_FINISH                    
#   _WM_ACE_FAIL                      
#   _WM_ACE_HEAD                      
#   _WM_ACE_GRAB                      
#   _WM_ACE_HEAD_DONE                 
#   _WM_ACE_HOME                      
#   _WM_ACE_HOME_Z                    
#   _wm_ace_unload_next               [delayed] 
#   _WM_ACE_UNLOAD_RUN                 - The pulling part of ACE_WM_UNLOAD (runs after the tool is picked up, use ACE_WM_UNLOAD)
#   _wm_ace_tick                      [delayed] 
#   _WM_ACE_ASSIST_SYNC                - Feed assist on for the tool on the carriage while printing, off otherwise (_ACE_WM_ASSIST b
#   _wm_ace_watch                     [delayed] 
#   _WM_ACE_ASK_LOAD                   - Window after an unload - the slot has filament again, load the tool or not (the auto load 
#   _WM_ACE_ASK_YES                    - Button Load of the window after an unload
#   _WM_ACE_ASK_NO                     - Button No of the window after an unload
# ---- END INDEX ----


# ---------------------------------------------------------------- settings
[gcode_macro _WM_ACE]
variable_ace_instance: 0         # which ACE unit these macros use, 0 = the first
# --- distances (mm) - measure your tubes, then tune with test feeds
variable_max_total_mm: 3000      # absolute safety limit for one load
variable_hub_to_head_mm: 1200    # the longest slow feed of one load (it stops earlier, when the tool head sensor sees the filament). Real distance after the preload = tube_full_mm - preload_mm (1000) plus 200 safety
variable_tube_full_mm: 1450      # mm  the full tube length from the ACE back filament port to the tool head sensor, as the printer is built
variable_preload_mm: 450         # mm  what the ACE preloads when a new spool is put in (the filament already sits this far in the tube)
variable_measure_margin_mm: 40   # mm  extra safety kept slow at the end of the first load. The fast start of a tool that is not measured yet = tube_full_mm - preload_mm - slow_tail_mm - this. 0 = the load runs all slow
variable_slow_tail_mm: 60        # the last part before the tool head is always fed slow. The fast part is the saved tube length minus this
variable_fast_speed: 60          # mm/s  the fast part of a load (only when the tube length of the tool is known)
variable_slow_speed: 20          # mm/s  the last part to the tool head (small overshoot after the sensor trips)
variable_retract_speed: 50       # mm/s  unload, back into the ACE
variable_tick_s: 0.3             # how often the sensors are polled while moving
variable_fast_timeout_s: 90      # s  the fast part may take this long, then the load stops with an error
variable_slow_timeout_s: 150     # s  the same for the slow part (a measuring load feeds the whole tube slow, 1038 mm for T0 took 56 s)
variable_auto_synced: 0          # 0 until the saved choice of the ACE_Auto_Load switch has been put on the switch (start-up)
# --- runtime state (do not edit)
variable_mode: "idle"            # idle | load_fast | load_slow | load_final | unload_hub
variable_tool: -1                # tool being loaded or unloaded right now, -1 = none
variable_ticks: 0                # sensor polls done in the current phase (time = ticks x tick_s)
variable_fed: 0                  # polls of the current phase in which the ACE was really feeding (a refused feed is not counted)
variable_fast_mm: 0              # mm fed fast in the load that is running (0 = this load is all slow and measures the tube)
variable_measuring: 0            # 1 while the load that is running measures the tube (fast start, then slow)
variable_assist: -1              # tool whose feed assist is on right now, -1 = none
variable_resync: 0               # seconds until feed assist may be switched on again after the ACE lost it (reconnect)
variable_manual: -2            # feed assist set by hand (_ACE_WM_ASSIST): -2 = no choice, -1 = forced off, 0..3 = forced on for that tool. Cleared when a print starts or ends
variable_pstate: ""              # print state seen at the last check (to notice a print start or end)
variable_prev: ""                # ACE slot states seen at the last check, e.g. ready,ready,empty,ready (to notice a new spool)
variable_baselined: 0            # 1 once the slot states were read one time after start-up (no auto load before that)
variable_hold_slot: -1            # the slot the hold is about (the one just loaded or unloaded); other slots are not held
variable_hold: 0                 # seconds left in which auto load is held off for hold_slot
variable_unload_hold: 5          # s  hold after an unload (measured: the ACE does not grip the old filament end again by itself). Raise it when an unloaded tool loads again by itself
variable_hold_ask: 0             # 1 = the hold comes from an unload: when it ends and the slot is ready with an empty tool head, a window asks to load
variable_quiet_s: 5              # the ACE must be quiet (no slot preloading or shifting) this many seconds before the next load starts
variable_retry_max: 10           # how many times a refused feed is tried again (4 s apart) before the load stops with an error
variable_unload_queue: ""        # tools whose ACE_WM_UNLOAD came while the ACE was busy: they start one after the other when it is free (F-153)
variable_unload_wait: 0          # 2 s checks done while waiting to start the next queued unload
variable_unloading_since: -1     # time (estimated_print_time) an ACE_WM_UNLOAD started, -1 = none. Cleared when the ACE finishes. Counts as busy for 10 minutes at most
variable_queue: ""               # slots waiting to load, in the order the spools were put in, e.g. "1,2"
variable_quiet: 0                # seconds the ACE has been quiet so far
variable_waited: 0               # 1 = the message that a load waits for the ACE was already shown
variable_retry: 0                # refused feeds tried again so far in this load
gcode:

# ---------------------------------------------------------------- helpers
[gcode_macro _WM_ACE_FINISH]
gcode:
    {% set fw = printer["gcode_macro _WM_ACE"] %}
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unloading_since VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold_slot VALUE={fw.tool}
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
    {% if fw.mode == "unload_hub" %}
        # after an unload: short hold, then a window asks when the slot is ready again (a spool put in during the hold is not lost)
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE={fw.unload_hold|int}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold_ask VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE=90
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold_ask VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=retry VALUE=0

[gcode_macro _WM_ACE_FAIL]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_STOP_FEED T={w.tool}
    ACE_STOP_RETRACT T={w.tool}
    RESPOND TYPE=error MSG="ACE: {params.MSG|default('failed')} (tool T{w.tool + 1})"
    _WM_ACE_FINISH
    {% if "gcode_macro _WM_UNLOAD" in printer %}
        _WM_UNLOAD_ABORT
    {% endif %}

# ---------------------------------------------------------------- tool head sensor reached while loading
# Called as the FIRST line of the insert_gcode of each tool head sensor (extruder0..3.cfg), before WM's insert routine
# takes over the G-code queue. During an ACE load it stops the fast feed, waits 1 s (the ACE refuses a new feed right after
# a stop), turns feed assist on for that tool and finishes. Does nothing when the ACE is not loading that tool.
[gcode_macro _WM_ACE_HEAD]
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if w.tool == t and (w.mode == "load_fast" or w.mode == "load_slow") %}
        {% if w.mode == "load_fast" %}
            # reached in the fast part: the saved length was too long, or the filament did not start at the ACE. Measure again next time
            # the ACE feeds a bit less than the speed says, so a measured length can come out too long. Save what this fast part
            # really fed (time x speed, minus 10 percent) so the next fast part ends before the tool head. Too short to trust = measure again
            {% set est = (w.ticks * w.tick_s * w.fast_speed * 0.9)|round|int %}
            {% if est >= 300 and est < w.fast_mm %}
                SAVE_VARIABLE VARIABLE=wm_ace_len_t{t} VALUE={est}
                RESPOND MSG="ACE: the filament reached the tool head in the fast part. The tube length of T{t + 1} is now {est} mm (the next load feeds fast for {[est - w.slow_tail_mm, 0]|max} mm)"
            {% else %}
                SAVE_VARIABLE VARIABLE=wm_ace_len_t{t} VALUE=0
                RESPOND MSG="ACE: the filament reached the tool head in the fast part. The tube length of T{t + 1} is measured again at the next load"
            {% endif %}
        {% else %}
            # tube length = what was fed fast + what was fed slow (only the polls in which the ACE was feeding count).
            # A load that was all slow is a full measurement and is always saved. A load with a fast part only corrects the saved
            # length downwards (shorter is the safe side for the fast part)
            # F-152: a measuring load fed its fast start 10 percent short (the ACE feeds less than the speed says), so that part counts 90 percent
            {% set total = ((w.fast_mm * (0.9 if w.measuring|int == 1 else 1.0)) + w.fed * w.tick_s * w.slow_speed)|round|int %}
            {% set known = printer.save_variables.variables["wm_ace_len_t%d" % t]|default(0)|float %}
            {% if total >= 60 and (known <= 0 or w.fast_mm == 0 or w.measuring|int == 1 or total < known) and total != known %}
                SAVE_VARIABLE VARIABLE=wm_ace_len_t{t} VALUE={total}
                RESPOND MSG="ACE: tube length of T{t + 1} measured, {total} mm (saved). The next load of T{t + 1} feeds fast for {[total - w.slow_tail_mm, 0]|max} mm"
            {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_final"'
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        ACE_STOP_FEED T={t}
        G4 P1000
        M400
        ACE_ENABLE_FEED_ASSIST T={t}
        RESPOND MSG="ACE: filament at toolhead T{t + 1}, feed assist on"
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

# ---------------------------------------------------------------- extruder grab + feed assist off (called from insert_gcode)
# _WM_ACE_GRAB: called right before WM's filament_insert (inside its window where cold extrusion is allowed). Only during an ACE load:
# a short slow push of the extruder gear so it grabs the filament that feed assist is pushing against it.
[gcode_macro _WM_ACE_GRAB]
variable_grab_mm: 5              # mm the extruder turns so its gears grab the filament
variable_grab_speed: 5           # mm/s
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set ename = "extruder" if t == 0 else "extruder" ~ t %}
    {% if t >= 0 and printer[ename] is defined and printer[ename].temperature < 180 %}
        # F-150: the tool on the carriage heats at the wipe position (a head that is not on the carriage heats where it is)
        {% if printer.save_variables.variables.current_extruder|default(99)|int == t and "gcode_macro _WM_GO_WIPE_HEAT" in printer %}
            RESPOND MSG="ACE: T{t + 1} goes to the purge location and heats to 220 (cold extrusion is not allowed on this Klipper)"
            _WM_GO_WIPE_HEAT T={t} S=220
        {% else %}
            RESPOND MSG="ACE: heating T{t + 1} to 220 (cold extrusion is not allowed on this Klipper)"
            SET_HEATER_TEMPERATURE HEATER={ename} TARGET=220
            TEMPERATURE_WAIT SENSOR={ename} MINIMUM=217.5 MAXIMUM=222.5
        {% endif %}
    {% endif %}
    {% if w.tool == t and w.mode == "load_final" %}
        M83
        G92 E0
        G1 E{grab_mm} F{grab_speed * 60}
        M400
    {% endif %}

# _WM_ACE_HEAD_DONE: last line of insert_gcode (WM's insert routine is finished): feed assist off again, unless a print runs
[gcode_macro _WM_ACE_HEAD_DONE]
gcode:
    {% set t = params.T|default(-1)|int %}
    # F-166: tells the load menu that the insert routine of this tool is finished
    {% if "gcode_macro _WM_LOAD" in printer and printer["gcode_macro _WM_LOAD"].active|int == 1 and printer["gcode_macro _WM_LOAD"].current|int == t %}
        SET_GCODE_VARIABLE MACRO=_WM_LOAD VARIABLE=loaded VALUE=1
    {% endif %}
    {% if printer.print_stats.state != "printing" and t >= 0 %}
        ACE_DISABLE_FEED_ASSIST T={t}
    {% endif %}

# ---------------------------------------------------------------- SET_GCODE_OFFSET while Z is not homed
# WM's tool change ends with SET_GCODE_OFFSET X Y Z MOVE=1 (the new tool's offsets). While Z is not homed that move is refused
# ("Must home axis first") and the tool change aborts after the tool is already mounted. While Z is not homed nothing is known about
# Z anyway, so this wrapper sets the offsets WITHOUT the move then. With Z homed it passes everything through unchanged.
# (Same block as in rpi_pi.cfg of WM_Ultra_Vanilla_Klipper: identical sections in two files are merged by Klipper, so it is safe to have both.
#  This copy makes the ACE panel work on its own.)
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _WM_SET_GCODE_OFFSET
gcode:
    {% if "gcode_macro _WM_LIVEZ_SGO" in printer %}
        # live Z adjust per tool (rpi_zoffset.cfg of WM_Ultra_Vanilla_Klipper): it does the same pass-through and keeps a Z_ADJUST per tool
        _WM_LIVEZ_SGO {rawparams}
    {% elif "z" not in printer.toolhead.homed_axes %}
        _WM_SET_GCODE_OFFSET {rawparams|replace("MOVE=1", "MOVE=0")|replace("move=1", "move=0")|replace("Move=1", "MOVE=0")}
    {% else %}
        _WM_SET_GCODE_OFFSET {rawparams}
    {% endif %}

# ---------------------------------------------------------------- LOAD
# _WM_ACE_HOME: homes X Y Z for ACE_WM_LOAD / ACE_WM_UNLOAD with the tool that is already on the carriage, instead of WM's own routine
# (which docks the tool and takes T0 for the Z touch). All tools docked, or anything unsafe or unclear: it falls back to WM's own G28 (T0)
# (WM's tool change ends with a Z move for the tool offset, which fails while Z is not homed). It never touches Z without a tool on the carriage.
# A hot nozzle is wiped first (as WM does before it homes Z during a print).
[gcode_macro _WM_ACE_HOME]
variable_wipe_above: 150        # C: a nozzle hotter than this is wiped (WM's WIPE_NOZZLE, X and Y moves only) before the Z touch
variable_max_off_z: 0.5          # mm: a stored tool Z offset larger than this is not trusted
variable_max_off_xy: 1.0         # mm: same for X and Y
variable_apply_z: 0              # 1 = after the touch shift Z by the tool's Z offset (0 = only report it, until the paper test says which is right)
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set cur = sv.current_extruder|default(99)|int %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if "x" in homed and "y" in homed and "z" in homed %}
        RESPOND MSG="ACE: axes are already homed"
    {% else %}
        {% set tool = cur if (cur >= 0 and cur <= 3) else t %}
        {% set ns = namespace(why="") %}
        {% if printer.print_stats.state == "printing" or printer.print_stats.state == "paused" %}
            {% set ns.why = "a print is running" %}
        {% elif sv.fail_flag|default(0)|int != 0 %}
            {% set ns.why = "an earlier tool change failed (fail_flag)" %}
        {% elif cur < 0 or cur > 3 %}
            {% set ns.why = "all tools are docked (WonderMaker's tool change needs Z homed first)" %}
        {% elif tool < 0 or tool > 3 %}
            {% set ns.why = "no valid tool" %}
        {% else %}
            {% set off = sv["t%d_offset" % tool] %}
            {% set ename = "extruder" if tool == 0 else "extruder%d" % tool %}
            {% if off is not defined or off|length != 3 or off[2]|float|abs > max_off_z or off[0]|float|abs > max_off_xy or off[1]|float|abs > max_off_xy %}
                {% set ns.why = "the stored offset of T%d is missing or too large" % tool %}
            {% endif %}
        {% endif %}
        SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
        {% if ns.why != "" %}
            RESPOND MSG="ACE: quick homing skipped ({ns.why}), using WonderMaker's own homing (T0)"
            z_rise
            G28
        {% else %}
            RESPOND MSG="ACE: homing X Y, then Z with T{tool}"
            z_rise
            G28 X Y
            {% if printer[ename].temperature|float > wipe_above %}
                RESPOND MSG="ACE: the nozzle of T{tool} is hot, wiping it first"
                z_rise
                WIPE_NOZZLE
            {% endif %}
            _WM_ACE_HOME_Z
        {% endif %}
    {% endif %}

# _WM_ACE_HOME_Z: the Z touch with the tool on the carriage (WM's _Z_HOMING without its T0). Refuses without a tool.
[gcode_macro _WM_ACE_HOME_Z]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set cur = sv.current_extruder|default(99)|int %}
    {% if cur < 0 or cur > 3 %}
        {action_raise_error("ACE: no tool on the carriage, Z is not homed")}
    {% endif %}
    {% set oz = sv["t%d_offset" % cur][2]|float %}
    {% set apply = printer["gcode_macro _WM_ACE_HOME"].apply_z|int %}
    RESPOND MSG="ACE: Z touch with T{cur} (stored Z offset {oz})"
    SET_GCODE_VARIABLE MACRO=_CHANGE_TOOL VARIABLE=save_position VALUE=0
    z_rise
    G1 X150 Y135 F3000
    M400
    G28 Z
    {% if apply == 1 %}
        SET_KINEMATIC_POSITION Z={7.0 + oz}
    {% endif %}
    # give the tool its own offsets back (WM's own macro)
    _OFFSET_SET

[gcode_macro ACE_WM_LOAD]
description: Feed ACE slot T (0-3) to the tool head sensor, fast first when the tube length is known. WM's own insert routine then takes over.
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% set nb = namespace(busy=0) %}
    {% if inst in printer %}
        {% for i in range(4) %}
            {% if printer[inst].slots[i].status|string in ["preload", "shifting", "identifying", "feeding", "unwinding"] and i != w.assist %}
                {% set nb.busy = nb.busy + 1 %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_LOAD: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("ACE_WM_LOAD: not while printing")}
    {% elif printer["filament_switch_sensor filament" ~ t].filament_detected %}
        RESPOND MSG="ACE: filament already at toolhead T{t + 1}"
    {% elif nb.busy > 0 %}
        {% set q = w.queue.split(",") if w.queue else [] %}
        {% if (t|string) not in q %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=queue VALUE='"{(q + [t|string])|join(",")}"'
        {% endif %}
        RESPOND MSG="ACE: the ACE is still preloading, T{t + 1} loads when it is done"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=retry VALUE=0
        z_rise
        {% if not ("x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes) %}
            _WM_ACE_HOME T={t}
        {% endif %}
        # put tool t in the hand first: WM's tool change then switches ON its filament sensor, so WM's own auto load
        # (heat, push, wipe, park) runs when the filament reaches the toolhead (nothing to do when it is already in the hand)
        _CHANGE_TOOL T={t}
        M400
        # F-164: the tool is at the purge location before the filament starts to feed (the grab heats it there)
        {% if "gcode_macro _WM_PURGE_LOCATION" in printer %}
            _WM_PURGE_LOCATION
            M400
        {% elif "gcode_macro _WM_GO_WIPE" in printer %}
            _WM_GO_WIPE
            M400
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=fed VALUE=0
        # the tube length of this tool as an earlier load measured it (0 = not measured yet)
        {% set known = printer.save_variables.variables["wm_ace_len_t%d" % t]|default(0)|float %}
        {% set fast_mm = (known - w.slow_tail_mm)|round|int %}
        {% if known > 0 and fast_mm >= 60 %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=fast_mm VALUE={fast_mm}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_fast"'
            RESPOND MSG="ACE: feeding slot {t+1} fast for {fast_mm} mm, then slow to the tool head"
            ACE_FEED T={t} LENGTH={fast_mm} SPEED={w.fast_speed}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=measuring VALUE=0
        {% elif (w.tube_full_mm - w.preload_mm - w.slow_tail_mm - w.measure_margin_mm)|int >= 100 %}
            {% set mfast = (w.tube_full_mm - w.preload_mm - w.slow_tail_mm - w.measure_margin_mm)|int %}
            # F-152: the first load of a tool starts fast too (full tube - preload - slow tail - margin), then goes slow and measures the whole tube
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=fast_mm VALUE={mfast}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=measuring VALUE=1
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_fast"'
            RESPOND MSG="ACE: feeding slot {t+1} fast for {mfast} mm, then slow to the tool head. This load measures the tube length of T{t + 1}, the next ones are faster"
            ACE_FEED T={t} LENGTH={mfast} SPEED={w.fast_speed}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=fast_mm VALUE=0
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=measuring VALUE=0
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_slow"'
            RESPOND MSG="ACE: feeding slot {t+1} slow to the tool head. This load measures the tube length of T{t + 1}, the next ones are faster"
            ACE_FEED T={t} LENGTH={w.hub_to_head_mm} SPEED={w.slow_speed}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

# ---------------------------------------------------------------- UNLOAD
[gcode_macro _ACE_WM_RETRACT]
description: ACE pulls filament T back into the ACE until the tool head sensor is clear and the ACE slot reports ready (run after WM's UNLOAD_FILAMENT).
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("_ACE_WM_RETRACT: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"unload_hub"'
        # F-183: the watcher starts BEFORE the retract: if ACE_RETRACT fails (ACE busy, timeout) the watcher still ends the unload with an error, so the mode never stays on unload_hub
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
        ACE_RETRACT T={t} LENGTH={w.max_total_mm} SPEED={w.retract_speed}
    {% endif %}

[gcode_macro ACE_WM_UNLOAD]
description: Full unload of tool T with a formed tip. Homes and picks up the tool by itself, then the extruder and the ACE pull together
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_UNLOAD: T must be 0-3")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("ACE_WM_UNLOAD: not while printing")}
    {% elif w.mode != "idle" or (w.unloading_since >= 0 and printer.toolhead.estimated_print_time - w.unloading_since < 600) %}
        # F-153: the ACE is still busy (an earlier unload or load is finishing): this unload starts by itself when it is free
        {% set uq = w.unload_queue.split(",") if w.unload_queue else [] %}
        {% if (t|string) not in uq %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unload_queue VALUE='"{(uq + [t|string])|join(",")}"'
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unload_wait VALUE=0
        RESPOND MSG="ACE: busy ({w.mode}), unload of T{t + 1} starts when the ACE is free"
        UPDATE_DELAYED_GCODE ID=_wm_ace_unload_next DURATION=2
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unloading_since VALUE={printer.toolhead.estimated_print_time|round|int}
        z_rise
        {% if not ("x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes) %}
            _WM_ACE_HOME T={t}
        {% endif %}
        ACE_DISABLE_FEED_ASSIST T={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold_slot VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE=900
        # _CHANGE_TOOL picks the real toolhead n (WM's T<n> would follow the print map box_modify_t*); it homes X and Y when needed, puts the tool in the hand back in its dock and picks up tool t (nothing to do when it is already in the hand)
        _CHANGE_TOOL T={t}
        M400
        _WM_ACE_UNLOAD_RUN T={t}
    {% endif %}

[delayed_gcode _wm_ace_unload_next]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set uq = w.unload_queue.split(",") if w.unload_queue else [] %}
    {% if uq|length > 0 %}
        {% if printer.print_stats.state == "printing" %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unload_queue VALUE='""'
            RESPOND TYPE=error MSG="ACE: the queued unload was dropped because a print started"
        {% elif w.mode == "idle" and (w.unloading_since < 0 or printer.toolhead.estimated_print_time - w.unloading_since >= 600) %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unload_queue VALUE='"{uq[1:]|join(",")}"'
            RESPOND MSG="ACE: the ACE is free, unloading T{uq[0]|int + 1}"
            ACE_WM_UNLOAD T={uq[0]}
            {% if uq|length > 1 %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_unload_next DURATION=5
            {% endif %}
        {% elif w.unload_wait|int >= 300 %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unload_queue VALUE='""'
            RESPOND TYPE=error MSG="ACE: still busy after 10 minutes, the queued unload ({uq|join(',')}) was dropped"
        {% else %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=unload_wait VALUE={w.unload_wait|int + 1}
            UPDATE_DELAYED_GCODE ID=_wm_ace_unload_next DURATION=2
        {% endif %}
    {% endif %}

[gcode_macro _WM_ACE_UNLOAD_RUN]
description: The pulling part of ACE_WM_UNLOAD (runs after the tool is picked up, use ACE_WM_UNLOAD)
# tip forming by the extruder alone: the ACE is idle (feed assist off) until the filament is out of the hotend, then it pulls it back
variable_push_mm: 3              # push a little to melt a short plug
variable_snap_mm: 20             # fast pull that snaps the string off at the nozzle
variable_snap_speed: 58          # mm/s
variable_pause_s: 4              # tip cools
variable_pull_mm: 45             # slow pull out of the hotend
variable_pull_speed: 10          # mm/s
variable_temp: 220               # C  unload temperature when no filament temperature is saved for the tool (the unload menu sets it too). With F-106 the recipe numbers below are only used without _WM_UNLOAD_TIP (zr_tools.cfg)
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% if printer.toolhead.extruder != en %}
        {action_raise_error("ACE_WM_UNLOAD: could not pick up tool T%d." % t)}
    {% endif %}
    ACE_DISABLE_FEED_ASSIST T={t}
    {% if "gcode_macro _WM_UNLOAD_TIP" in printer %}
        # F-106: the shared tip forming (zr_tools.cfg) at the wipe area, at the saved filament temperature of the tool
        {% set ls = printer["gcode_macro _WM_LOAD_SETTINGS"] %}
        {% set saved = printer.save_variables.variables["zr_t%d_temp" % t]|default(0)|int %}
        _WM_UNLOAD_TIP T={t} S={saved if saved >= ls.min_saved_temp|int else temp}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER={en} TARGET={temp}
        TEMPERATURE_WAIT SENSOR={en} MINIMUM={temp - 2.5} MAXIMUM={temp + 2.5}
        M83
        G92 E0
        G1 E{push_mm} F400
        M400
        G1 E-{snap_mm} F{snap_speed * 60}
        M400
        G4 P{pause_s * 1000}
        G1 E-{pull_mm} F{pull_speed * 60}
        M400
        SET_HEATER_TEMPERATURE HEATER={en} TARGET=0
        SET_STEPPER_ENABLE STEPPER={en} ENABLE=0
    {% endif %}
    _ACE_WM_RETRACT T={t}

[gcode_macro ACE_WM_STOP]
description: Emergency stop of any ACE feed/retract started by these macros.
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% for i in range(4) %}
        ACE_STOP_FEED T={i}
        ACE_STOP_RETRACT T={i}
    {% endfor %}
    _WM_ACE_FINISH
    {% if "gcode_macro _WM_UNLOAD_STOP" in printer %}
        _WM_UNLOAD_STOP QUIET=1
    {% endif %}
    RESPOND MSG="ACE: stopped"

# ---------------------------------------------------------------- sensor poll (state machine)
[delayed_gcode _wm_ace_tick]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set t = w.tool %}
    {% set mode = w.mode %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% if mode != "idle" and t >= 0 %}
        {% set head = printer["filament_switch_sensor filament" ~ t].filament_detected %}
        {% set secs = (w.ticks + 1) * w.tick_s %}
        # feeding = the ACE is really pushing filament in this poll. fed counts those polls: it tells a finished feed from one that never started
        {% set feeding = (inst in printer) and (printer[inst].slots[t].status|string == "feeding") %}
        {% set fed = w.fed + (1 if feeding else 0) %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE={w.ticks + 1}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=fed VALUE={fed}
        {% if mode == "load_fast" %}
            {% if head %}
                _WM_ACE_HEAD T={t}
            {% elif fed > 0 and not feeding %}
                # the ACE has fed the fast length and stopped by itself: go on slow until the tool head sensor sees the filament
                ACE_STOP_FEED T={t}
                G4 P500
                M400
                RESPOND MSG="ACE: fast part done, creeping to the tool head..."
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_slow"'
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=fed VALUE=0
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=retry VALUE=0
                ACE_FEED T={t} LENGTH={w.hub_to_head_mm} SPEED={w.slow_speed}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% elif fed == 0 and w.ticks > 0 and w.ticks % 14 == 0 %}
                {% if w.retry >= w.retry_max %}
                    _WM_ACE_FAIL MSG="the ACE did not start feeding after {w.retry_max} tries (busy preloading or a slot problem)"
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=retry VALUE={w.retry + 1}
                    RESPOND MSG="ACE: not feeding yet, trying again ({w.retry + 1} of {w.retry_max})"
                    ACE_FEED T={t} LENGTH={w.fast_mm} SPEED={w.fast_speed}
                    UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
                {% endif %}
            {% elif secs > w.fast_timeout_s %}
                _WM_ACE_FAIL MSG="the fast part of the load did not finish - check slot/tube"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "load_final" %}
            {% if secs > 2 %}
                RESPOND MSG="ACE: tool T{t + 1} loaded"
                _WM_ACE_FINISH
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "load_slow" %}
            {% if head %}
                _WM_ACE_HEAD T={t}
            {% elif not feeding and w.ticks > 0 and w.ticks % 14 == 0 %}
                {% if w.retry >= w.retry_max %}
                    _WM_ACE_FAIL MSG="the ACE did not start feeding after {w.retry_max} tries (busy preloading or a slot problem)"
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=retry VALUE={w.retry + 1}
                    RESPOND MSG="ACE: not feeding yet, trying again ({w.retry + 1} of {w.retry_max})"
                    ACE_FEED T={t} LENGTH={w.hub_to_head_mm} SPEED={w.slow_speed}
                    UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
                {% endif %}
            {% elif secs > w.slow_timeout_s %}
                _WM_ACE_FAIL MSG="toolhead sensor never triggered - check tube"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "unload_hub" and printer["ace_instance_0"].slots[t].status == "empty" %}
            ACE_STOP_RETRACT T={t}
            RESPOND MSG="ACE: tool T{t|int + 1} unloaded (slot is empty)"
            {% if printer.print_stats.state not in ["printing", "paused"] %}
                PARK_CURRENT_TOOL
            {% endif %}
            _WM_ACE_FINISH
        {% elif mode == "unload_hub" %}
            {% set st = printer["ace_instance_0"].slots[t].status %}
            {% set headclear = not head %}
            {% if secs > 8 and st == "ready" and headclear %}
                ACE_STOP_RETRACT T={t}
                RESPOND MSG="ACE: tool T{t|int + 1} unloaded"
                {% if printer.print_stats.state not in ["printing", "paused"] %}
                    PARK_CURRENT_TOOL
                {% endif %}
                _WM_ACE_FINISH
            {% elif secs > w.fast_timeout_s + 30 %}
                _WM_ACE_FAIL MSG="the ACE did not finish pulling the filament back (slot status {st}, toolhead sensor {"still sees filament" if not headclear else "clear"})"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------- feed assist of the tool on the carriage (called by the watcher below)
# B-040: Klipper fills in a delayed_gcode's values when its timer fires. While START_PRINT or a cancel runs, the watcher's
# commands wait in the queue and ran minutes later with old values (assist on slot 1 while T0 printed; assist on slot 0
# after T0 was parked, then the ACE stayed busy). A macro reads the printer when it runs, so the decision lives here.
# The tool on the carriage is the saved current_extruder (0-3; 99 = none): the extruder name stays on the last tool after a park.
[gcode_macro _WM_ACE_ASSIST_SYNC]
description: Feed assist on for the tool on the carriage while printing, off otherwise (_ACE_WM_ASSIST by hand wins until a print starts or ends)
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set printing = (printer.print_stats.state == "printing") %}
    # ---- a print that starts or ends clears the choice made by hand
    {% set ps = printer.print_stats.state %}
    {% set manual = w.manual %}
    {% if w.pstate != ps %}
        {% if (ps in ["printing", "paused"]) != (w.pstate in ["printing", "paused"]) %}
            {% set manual = -2 %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE=-2
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=pstate VALUE='"{ps}"'
    {% endif %}
    # ---- feed assist follows the tool on the carriage, only while printing
    {% if w.mode == "idle" %}
        {% set tn = printer.save_variables.variables.current_extruder|default(99)|int %}
        {% if manual == -2 %}
            {% set want = tn if (printing and tn >= 0 and tn <= 3) else -1 %}
        {% else %}
            {% set want = manual %}
        {% endif %}
        # the ACE dropped off USB and came back: it reports no feed assist although ours should be on. Count it as off, so it is
        # switched on again for the tool that is on the carriage now (at most every 10 s)
        {% set an = "ace_instance_" ~ w.ace_instance %}
        {% set lost = (w.assist >= 0 and an in printer and printer[an].connection_state == "connected" and printer[an].feed_assist_slot is defined and printer[an].feed_assist_slot|int != w.assist) %}
        {% if w.resync|int > 0 %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=resync VALUE={w.resync|int - 1}
        {% endif %}
        {% if lost and want == w.assist and w.resync|int == 0 %}
            RESPOND MSG="ACE: feed assist was lost (reconnect), on again for T{want}"
            ACE_ENABLE_FEED_ASSIST T={want}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=resync VALUE=10
        {% endif %}
        {% if want != w.assist %}
            {% if w.assist >= 0 and not lost %}
                ACE_DISABLE_FEED_ASSIST T={w.assist}
            {% endif %}
            {% if want >= 0 %}
                ACE_ENABLE_FEED_ASSIST T={want}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE={want}
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------- feed assist + auto load (1 s watcher, no WM macro edited)
[delayed_gcode _wm_ace_watch]
initial_duration: 10             # s  first check this long after Klipper has started
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% if inst in printer %}
        {% set printing = (printer.print_stats.state == "printing") %}
        # ---- ACE_Auto_Load switch (Fluidd Outputs / panel): restored from the saved variable at start-up, saved whenever it changes
        {% set auto_on = True %}
        {% if "output_pin ACE_Auto_Load" in printer %}
            {% set pin = printer["output_pin ACE_Auto_Load"].value|int %}
            {% set saved = printer.save_variables.variables.ace_auto_load|default(1)|int %}
            {% if not w.auto_synced %}
                {% if pin != saved %}
                    SET_PIN PIN=ACE_Auto_Load VALUE={saved}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=auto_synced VALUE=1
                {% set pin = saved %}
            {% elif pin != saved %}
                SAVE_VARIABLE VARIABLE=ace_auto_load VALUE={pin}
            {% endif %}
            {% set auto_on = (pin == 1) %}
        {% endif %}
        # ---- feed assist: decided by _WM_ACE_ASSIST_SYNC when it runs (B-040), not here
        _WM_ACE_ASSIST_SYNC
        # ---- auto load when a spool is put in a slot (slot status becomes "ready")
        {% set cur = [] %}
        {% for i in range(4) %}
            {% set _ = cur.append(printer[inst].slots[i].status|string) %}
        {% endfor %}
        {% set prev = w.prev.split(",") if w.prev else [] %}
        {% set wq = namespace(q=(w.queue.split(",") if w.queue else []), busy=0) %}
        # the ACE is busy while a slot preloads or shifts (it refuses feeds then); the slot with feed assist is not counted
        {% for i in range(4) %}
            {% if cur[i] in ["preload", "shifting", "identifying", "feeding", "unwinding"] and i != w.assist %}
                {% set wq.busy = wq.busy + 1 %}
            {% endif %}
        {% endfor %}
        # a spool put in a slot goes to the end of the queue (only while auto load is on)
        {% if w.baselined and auto_on and not printing and prev|length == 4 %}
            {% for i in range(4) %}
                {% if prev[i] != "ready" and cur[i] == "ready" and (i|string) not in wq.q and not (w.mode != "idle" and w.tool == i) and not (w.hold > 0 and w.hold_slot == i) %}
                    {% if not printer["filament_switch_sensor filament" ~ i].filament_detected %}
                        {% set wq.q = wq.q + [i|string] %}
                        RESPOND MSG="ACE: spool detected in slot {i + 1}, T{i + 1} loads when the ACE is quiet"
                    {% endif %}
                {% endif %}
            {% endfor %}
        {% endif %}
        # a slot that was emptied again leaves the queue
        {% set keep = [] %}
        {% for x in wq.q %}
            {% if cur[x|int] != "empty" %}
                {% set _ = keep.append(x) %}
            {% endif %}
        {% endfor %}
        {% set wq.q = keep %}
        # load the first one in the queue when the ACE has been quiet for quiet_s seconds
        {% if wq.q|length > 0 and w.mode == "idle" and not printing %}
            {% if wq.busy > 0 %}
                {% if w.quiet != 0 %}
                    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=quiet VALUE=0
                {% endif %}
                {% if not w.waited %}
                    RESPOND MSG="ACE: waiting for the ACE to finish preloading before loading T{wq.q[0]}"
                    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=waited VALUE=1
                {% endif %}
            {% elif w.quiet + 1 >= w.quiet_s %}
                {% set go = wq.q[0]|int %}
                {% set wq.q = wq.q[1:] %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=quiet VALUE=0
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=waited VALUE=0
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=queue VALUE='"{wq.q|join(",")}"'
                RESPOND MSG="ACE: the ACE is quiet, loading T{go}"
                ACE_WM_LOAD T={go}
            {% else %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=quiet VALUE={w.quiet + 1}
            {% endif %}
        {% elif wq.q|length == 0 and (w.quiet != 0 or w.waited != 0) %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=quiet VALUE=0
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=waited VALUE=0
        {% endif %}
        {% if wq.q|join(",") != w.queue and not (wq.q|length > 0 and wq.busy == 0 and w.quiet + 1 >= w.quiet_s and w.mode == "idle" and not printing) %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=queue VALUE='"{wq.q|join(",")}"'
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=prev VALUE='"{cur|join(",")}"'
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=baselined VALUE=1
        {% if w.hold > 0 and w.mode == "idle" %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE={w.hold - 1}
            # the hold after an unload ends now: the slot has filament and the tool head is empty -> ask, nothing loads by itself
            {% if w.hold == 1 and w.hold_ask == 1 %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold_ask VALUE=0
                {% set hs = w.hold_slot|int %}
                {% set listing = ("gcode_macro _WM_UNLOAD" in printer) and (printer["gcode_macro _WM_UNLOAD"].active|int == 1) %}
                {% if hs >= 0 and hs <= 3 and auto_on and not printing and not listing and cur[hs] == "ready" and (hs|string) not in wq.q %}
                    {% if not printer["filament_switch_sensor filament" ~ hs].filament_detected %}
                        _WM_ACE_ASK_LOAD T={hs}
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_wm_ace_watch DURATION=1

# ---------------------------------------------------------------- window after an unload (opened by the watch above)
[gcode_macro _WM_ACE_ASK_LOAD]
description: Window after an unload - the slot has filament again, load the tool or not (the auto load watch opens it)
gcode:
    {% set t = params.T|default(-1)|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if t < 0 or t > 3 %}
        RESPOND TYPE=error MSG="_WM_ACE_ASK_LOAD: T must be 0 to 3"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Load T{t|int + 1}"
        RESPOND TYPE=command MSG="action:prompt_text Slot {t + 1} of the ACE has filament and T{t + 1} is empty."
        RESPOND TYPE=command MSG="action:prompt_text T{t|int + 1} was unloaded a moment ago, so it does not load by itself."
        RESPOND TYPE=command MSG="action:prompt_text Load T{t|int + 1} now"
        RESPOND TYPE=command MSG="action:prompt_footer_button Load T{t|int + 1}|_WM_ACE_ASK_YES T={t}|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button No|_WM_ACE_ASK_NO T={t}"
        RESPOND TYPE=command MSG="action:prompt_show"
        RESPOND MSG="ACE: slot {t + 1} has filament and T{t|int + 1} was just unloaded. Answer the window, or run ACE_WM_LOAD T={t}"
    {% endif %}

[gcode_macro _WM_ACE_ASK_YES]
description: Button Load of the window after an unload
gcode:
    {% set t = params.T|default(-1)|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if t < 0 or t > 3 %}
        RESPOND TYPE=error MSG="_WM_ACE_ASK_YES: T must be 0 to 3"
    {% else %}
        ACE_WM_LOAD T={t}
    {% endif %}

[gcode_macro _WM_ACE_ASK_NO]
description: Button No of the window after an unload
gcode:
    {% set t = params.T|default(-1)|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="ACE: T{t + 1} is not loaded. To load it later run ACE_WM_LOAD T={t}"

[gcode_macro _ACE_WM_ASSIST]
description: _ACE_WM_ASSIST T=0-3 STATE=on|off|toggle - feed assist of one tool by hand. Stays until the next print starts or ends, also while paused
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set st = params.STATE|default("toggle")|lower %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("_ACE_WM_ASSIST: T must be 0 to 3")}
    {% endif %}
    {% if inst not in printer %}
        {action_raise_error("_ACE_WM_ASSIST: no ACE found")}
    {% endif %}
    {% if w.mode != "idle" %}
        {action_raise_error("_ACE_WM_ASSIST: the ACE is loading or unloading, try again when it is done")}
    {% endif %}
    {% set cur = printer[inst].feed_assist_slot|default(-1)|int %}
    {% set on = (cur != t) if st == "toggle" else (st == "on") %}
    {% if on %}
        {% if cur >= 0 and cur != t %}
            ACE_DISABLE_FEED_ASSIST T={cur}
        {% endif %}
        {% if cur != t %}
            ACE_ENABLE_FEED_ASSIST T={t}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE={t}
        RESPOND MSG="ACE: feed assist on for T{t + 1} (by hand)"
    {% else %}
        {% if cur == t %}
            ACE_DISABLE_FEED_ASSIST T={t}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE=-1
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE=-1
        {% endif %}
        RESPOND MSG="ACE: feed assist off for T{t + 1} (by hand)"
    {% endif %}

[gcode_macro _ACE_WM_AUTO]
description: _ACE_WM_AUTO ENABLE=1|0 - auto load when a spool is inserted
gcode:
    SET_PIN PIN=ACE_Auto_Load VALUE={params.ENABLE|default(1)|int}
    RESPOND MSG="ACE auto-load: {'on' if params.ENABLE|default(1)|int else 'off'}"

# ---------------------------------------------------------------- dryer (Fluidd buttons)
[gcode_macro _ACE_WM_DRY_START]
description: Start drying. TEMP (deg C, max 65) and DURATION (same unit as ACE_START_DRYING)
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_START_DRYING INSTANCE={w.ace_instance} TEMP={params.TEMP|default(50)|int} DURATION={params.DURATION|default(240)|int}

[gcode_macro _ACE_WM_DRY_STOP]
description: Stop drying
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_STOP_DRYING INSTANCE={w.ace_instance}
