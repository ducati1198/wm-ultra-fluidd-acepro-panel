# ============================================================================
# rpi_ace.cfg  -  Anycubic ACE Pro as feeder + dryer for the WonderMaker ZR Ultra-S
# Load and unload tested on the printer (T0-T3). The grab push and feed-assist-off at the end of a load are not yet tested.
#
# Wiring: ACE slot N tube -> hub inlet N -> toolhead N   (slot 1 = T0 ... slot 4 = T3)
# Uses only WM's existing sensors:  path_N (hub inlet)  and  filament<N> (on the toolhead).
# Does NOT redefine any WM macro. Does NOT use the ACE driver's T0..T7 tool-change logic.
# ============================================================================

# ---------------------------------------------------------------- settings
[gcode_macro _WM_ACE]
variable_ace_instance: 0
# --- distances (mm) - measure your tubes, then tune with test feeds
variable_max_total_mm: 4000      # absolute safety limit for one load
variable_hub_to_head_mm: 710     # hub inlet -> toolhead sensor (slow phase length limit)
variable_tail_mm: 1800           # retract distance after the path sensor clears (hub -> back inside ACE)
variable_fast_speed: 60          # mm/s  ACE -> hub
variable_slow_speed: 20          # mm/s  hub -> toolhead (small overshoot after sensor trips)
variable_retract_speed: 50
variable_tick_s: 0.3             # how often the sensors are polled while moving
variable_fast_timeout_s: 90
variable_slow_timeout_s: 60
variable_auto_synced: 0          # 0 until the saved choice of the ACE_Auto_Load switch has been put on the switch (start-up)
# --- runtime state (do not edit)
variable_mode: "idle"            # idle | load_fast | load_slow | load_final | unload_hub | unload_tail
variable_tool: -1
variable_ticks: 0
variable_assist: -1
variable_manual: -2            # feed assist set by hand (ACE_WM_ASSIST): -2 = no choice, -1 = forced off, 0..3 = forced on for that tool. Cleared when a print starts or ends
variable_pstate: ""
variable_prev: ""
variable_baselined: 0
variable_hold: 0                 # seconds left in which auto load is held off (the ACE reports a slot empty then ready again after an unload)
gcode:

# ---------------------------------------------------------------- helpers
[gcode_macro _WM_ACE_FINISH]
gcode:
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE=90

[gcode_macro _WM_ACE_FAIL]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_STOP_FEED T={w.tool}
    ACE_STOP_RETRACT T={w.tool}
    RESPOND TYPE=error MSG="ACE: {params.MSG|default('failed')} (tool T{w.tool})"
    _WM_ACE_FINISH

# ---------------------------------------------------------------- tool head sensor reached while loading
# Called as the FIRST line of the insert_gcode of each tool head sensor (extruder0..3.cfg), before WM's insert routine
# takes over the G-code queue. During an ACE load it stops the fast feed, waits 1 s (the ACE refuses a new feed right after
# a stop), turns feed assist on for that tool and finishes. Does nothing when the ACE is not loading that tool.
[gcode_macro _WM_ACE_HEAD]
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if w.tool == t and (w.mode == "load_fast" or w.mode == "load_slow") %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_final"'
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        ACE_STOP_FEED T={t}
        G4 P1000
        M400
        ACE_ENABLE_FEED_ASSIST T={t}
        RESPOND MSG="ACE: filament at toolhead T{t}, feed assist on"
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

# ---------------------------------------------------------------- extruder grab + feed assist off (called from insert_gcode)
# _WM_ACE_GRAB: called right before WM's filament_insert (inside its window where cold extrusion is allowed). Only during an ACE load:
# a short slow push of the extruder gear so it grabs the filament that feed assist is pushing against it.
[gcode_macro _WM_ACE_GRAB]
variable_grab_mm: 5
variable_grab_speed: 5           # mm/s
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set ename = "extruder" if t == 0 else "extruder" ~ t %}
    {% if t >= 0 and printer[ename] is defined and printer[ename].temperature < 180 %}
        RESPOND MSG="ACE: heating T{t} to 220 (cold extrusion is not allowed on this Klipper)"
        M109 S220 T{t}
    {% endif %}
    {% if w.tool == t and w.mode == "load_final" %}
        M83
        G92 E0
        G1 E{grab_mm} F{grab_speed * 60}
        M400
    {% endif %}

# _WM_ACE_HEAD_DONE: last line of insert_gcode (WM's insert routine is finished): feed assist off again, unless a print runs
[gcode_macro _WM_ACE_HEAD_DONE]
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if printer.print_stats.state != "printing" and t >= 0 %}
        ACE_DISABLE_FEED_ASSIST T={t}
    {% endif %}

# ---------------------------------------------------------------- SET_GCODE_OFFSET while Z is not homed
# WM's tool change ends with SET_GCODE_OFFSET X Y Z MOVE=1 (the new tool's offsets). While Z is not homed that move is refused
# ("Must home axis first") and the tool change aborts after the tool is already mounted. While Z is not homed nothing is known about
# Z anyway, so this wrapper sets the offsets WITHOUT the move then. With Z homed it passes everything through unchanged.
# (Same block as in rpi_pi.cfg of WM_Ultra_Vanilla_Klipper: identical sections in two files are merged by Klipper, so it is safe to have both.
#  This copy makes the ACE panel work on its own.)
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _WM_SET_GCODE_OFFSET
gcode:
    {% if "z" not in printer.toolhead.homed_axes %}
        _WM_SET_GCODE_OFFSET {rawparams|replace("MOVE=1", "MOVE=0")|replace("move=1", "move=0")|replace("Move=1", "MOVE=0")}
    {% else %}
        _WM_SET_GCODE_OFFSET {rawparams}
    {% endif %}

# ---------------------------------------------------------------- LOAD
# _WM_ACE_HOME: homes X Y Z for ACE_WM_LOAD / ACE_WM_UNLOAD with the tool that is already on the carriage, instead of WM's own routine
# (which docks the tool and takes T0 for the Z touch). All tools docked, or anything unsafe or unclear: it falls back to WM's own G28 (T0)
# (WM's tool change ends with a Z move for the tool offset, which fails while Z is not homed). It never touches Z without a tool on the carriage.
# A hot nozzle is wiped first (as WM does before it homes Z during a print).
[gcode_macro _WM_ACE_HOME]
variable_wipe_above: 150        # C: a nozzle hotter than this is wiped (WM's WIPE_NOZZLE, X and Y moves only) before the Z touch
variable_max_off_z: 0.5          # mm: a stored tool Z offset larger than this is not trusted
variable_max_off_xy: 1.0         # mm: same for X and Y
variable_apply_z: 0              # 1 = after the touch shift Z by the tool's Z offset (0 = only report it, until the paper test says which is right)
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set cur = sv.current_extruder|default(99)|int %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if "x" in homed and "y" in homed and "z" in homed %}
        RESPOND MSG="ACE: axes are already homed"
    {% else %}
        {% set tool = cur if (cur >= 0 and cur <= 3) else t %}
        {% set ns = namespace(why="") %}
        {% if printer.print_stats.state == "printing" or printer.print_stats.state == "paused" %}
            {% set ns.why = "a print is running" %}
        {% elif sv.fail_flag|default(0)|int != 0 %}
            {% set ns.why = "an earlier tool change failed (fail_flag)" %}
        {% elif cur < 0 or cur > 3 %}
            {% set ns.why = "all tools are docked (WonderMaker's tool change needs Z homed first)" %}
        {% elif tool < 0 or tool > 3 %}
            {% set ns.why = "no valid tool" %}
        {% else %}
            {% set off = sv["t%d_offset" % tool] %}
            {% set ename = "extruder" if tool == 0 else "extruder%d" % tool %}
            {% if off is not defined or off|length != 3 or off[2]|float|abs > max_off_z or off[0]|float|abs > max_off_xy or off[1]|float|abs > max_off_xy %}
                {% set ns.why = "the stored offset of T%d is missing or too large" % tool %}
            {% endif %}
        {% endif %}
        SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
        {% if ns.why != "" %}
            RESPOND MSG="ACE: quick homing skipped ({ns.why}), using WonderMaker's own homing (T0)"
            z_rise
            G28
        {% else %}
            RESPOND MSG="ACE: homing X Y, then Z with T{tool}"
            z_rise
            G28 X Y
            {% if printer[ename].temperature|float > wipe_above %}
                RESPOND MSG="ACE: the nozzle of T{tool} is hot, wiping it first"
                z_rise
                WIPE_NOZZLE
            {% endif %}
            _WM_ACE_HOME_Z
        {% endif %}
    {% endif %}

# _WM_ACE_HOME_Z: the Z touch with the tool on the carriage (WM's Z_HOMING without its T0). Refuses without a tool.
[gcode_macro _WM_ACE_HOME_Z]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set cur = sv.current_extruder|default(99)|int %}
    {% if cur < 0 or cur > 3 %}
        {action_raise_error("ACE: no tool on the carriage, Z is not homed")}
    {% endif %}
    {% set oz = sv["t%d_offset" % cur][2]|float %}
    {% set apply = printer["gcode_macro _WM_ACE_HOME"].apply_z|int %}
    RESPOND MSG="ACE: Z touch with T{cur} (stored Z offset {oz})"
    SET_GCODE_VARIABLE MACRO=_CHANGE_TOOL VARIABLE=save_position VALUE=0
    z_rise
    G1 X150 Y135 F3000
    M400
    G28 Z
    {% if apply == 1 %}
        SET_KINEMATIC_POSITION Z={7.0 + oz}
    {% endif %}
    # give the tool its own offsets back (WM's own macro)
    _OFFSET_SET

[gcode_macro ACE_WM_LOAD]
description: Feed ACE slot T (0-3) to the hub, then to the toolhead sensor. WM's own insert routine then takes over.
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_LOAD: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("ACE_WM_LOAD: not while printing")}
    {% elif printer["filament_switch_sensor filament" ~ t].filament_detected %}
        RESPOND MSG="ACE: filament already at toolhead T{t}"
    {% else %}
        z_rise
        {% if not ("x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes) %}
            _WM_ACE_HOME T={t}
        {% endif %}
        # put tool t in the hand first: WM's tool change then switches ON its filament sensor, so WM's own auto load
        # (heat, push, wipe, park) runs when the filament reaches the toolhead (nothing to do when it is already in the hand)
        T{t}
        M400
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_fast"'
        RESPOND MSG="ACE: feeding slot {t+1} to hub..."
        ACE_FEED T={t} LENGTH={w.max_total_mm} SPEED={w.fast_speed}
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

# ---------------------------------------------------------------- UNLOAD
[gcode_macro ACE_WM_RETRACT]
description: ACE pulls filament T back until the hub sensor clears, then into the ACE (run after WM's UNLOAD_FILAMENT).
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_RETRACT: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"unload_hub"'
        ACE_RETRACT T={t} LENGTH={w.max_total_mm} SPEED={w.retract_speed}
        UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
    {% endif %}

[gcode_macro ACE_WM_UNLOAD]
description: Full unload of tool T with a formed tip. Homes and picks up the tool by itself, then the extruder and the ACE pull together
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_UNLOAD: T must be 0-3")}
    {% elif w.mode != "idle" %}
        {action_raise_error("ACE busy (" ~ w.mode ~ ")")}
    {% elif printer.print_stats.state == "printing" %}
        {action_raise_error("ACE_WM_UNLOAD: not while printing")}
    {% endif %}
    z_rise
    {% if not ("x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes) %}
        _WM_ACE_HOME T={t}
    {% endif %}
    ACE_DISABLE_FEED_ASSIST T={t}
    SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE=900
    # WM's T<n> homes X and Y when needed, puts the tool in the hand back in its dock and picks up tool t (nothing to do when it is already in the hand)
    T{t}
    M400
    _WM_ACE_UNLOAD_RUN T={t}

[gcode_macro _WM_ACE_UNLOAD_RUN]
description: The pulling part of ACE_WM_UNLOAD (runs after the tool is picked up, use ACE_WM_UNLOAD)
# tip forming by the extruder alone: the ACE is idle (feed assist off) until the filament is out of the hotend, then it pulls it back
variable_push_mm: 3              # push a little to melt a short plug
variable_snap_mm: 20             # fast pull that snaps the string off at the nozzle
variable_snap_speed: 58          # mm/s
variable_pause_s: 4              # tip cools
variable_pull_mm: 45             # slow pull out of the hotend
variable_pull_speed: 10          # mm/s
variable_temp: 220
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set en = "extruder" if t == 0 else "extruder%d" % t %}
    {% if printer.toolhead.extruder != en %}
        {action_raise_error("ACE_WM_UNLOAD: could not pick up tool T%d." % t)}
    {% endif %}
    ACE_DISABLE_FEED_ASSIST T={t}
    M109 S{temp} T{t}
    M83
    G92 E0
    G1 E{push_mm} F400
    M400
    G1 E-{snap_mm} F{snap_speed * 60}
    M400
    G4 P{pause_s * 1000}
    G1 E-{pull_mm} F{pull_speed * 60}
    M400
    M104 S0 T{t}
    SET_STEPPER_ENABLE STEPPER={en} ENABLE=0
    ACE_WM_RETRACT T={t}

[gcode_macro ACE_WM_STOP]
description: Emergency stop of any ACE feed/retract started by these macros.
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% for i in range(4) %}
        ACE_STOP_FEED T={i}
        ACE_STOP_RETRACT T={i}
    {% endfor %}
    _WM_ACE_FINISH
    RESPOND MSG="ACE: stopped"

# ---------------------------------------------------------------- sensor poll (state machine)
[delayed_gcode _wm_ace_tick]
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set t = w.tool %}
    {% set mode = w.mode %}
    {% if mode != "idle" and t >= 0 %}
        {% set head = printer["filament_switch_sensor filament" ~ t].filament_detected %}
        {% set hub = printer["filament_switch_sensor path_" ~ t].filament_detected %}
        {% set secs = (w.ticks + 1) * w.tick_s %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE={w.ticks + 1}
        {% if mode == "load_fast" %}
            {% if head %}
                _WM_ACE_HEAD T={t}
            {% elif hub %}
                ACE_STOP_FEED T={t}
                G4 P1000
                M400
                RESPOND MSG="ACE: filament at hub, creeping to toolhead..."
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"load_slow"'
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
                ACE_FEED T={t} LENGTH={w.hub_to_head_mm} SPEED={w.slow_speed}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% elif secs > w.fast_timeout_s %}
                _WM_ACE_FAIL MSG="hub sensor never triggered - check slot/tube"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "load_final" %}
            {% if secs > 2 %}
                RESPOND MSG="ACE: tool T{t} loaded"
                _WM_ACE_FINISH
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "load_slow" %}
            {% if head %}
                _WM_ACE_HEAD T={t}
            {% elif secs > w.slow_timeout_s %}
                _WM_ACE_FAIL MSG="toolhead sensor never triggered - check tube"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "unload_hub" and printer["ace_instance_0"].slots[t].status == "empty" %}
            ACE_STOP_RETRACT T={t}
            RESPOND MSG="ACE: tool T{t} unloaded (slot is empty)"
            _WM_ACE_FINISH
        {% elif mode == "unload_hub" %}
            {% if not hub %}
                ACE_STOP_RETRACT T={t}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=mode VALUE='"unload_tail"'
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=ticks VALUE=0
                ACE_RETRACT T={t} LENGTH={w.tail_mm} SPEED={w.retract_speed}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% elif secs > w.fast_timeout_s %}
                _WM_ACE_FAIL MSG="hub sensor never cleared"
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% elif mode == "unload_tail" %}
            {% if secs > (w.tail_mm / w.retract_speed) + 3 %}
                RESPOND MSG="ACE: tool T{t} unloaded"
                _WM_ACE_FINISH
            {% else %}
                UPDATE_DELAYED_GCODE ID=_wm_ace_tick DURATION={w.tick_s}
            {% endif %}
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------- feed assist + auto load (1 s watcher, no WM macro edited)
[delayed_gcode _wm_ace_watch]
initial_duration: 10
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% if inst in printer %}
        {% set printing = (printer.print_stats.state == "printing") %}
        # ---- ACE_Auto_Load switch (Fluidd Outputs / panel): restored from the saved variable at start-up, saved whenever it changes
        {% set auto_on = True %}
        {% if "output_pin ACE_Auto_Load" in printer %}
            {% set pin = printer["output_pin ACE_Auto_Load"].value|int %}
            {% set saved = printer.save_variables.variables.ace_auto_load|default(1)|int %}
            {% if not w.auto_synced %}
                {% if pin != saved %}
                    SET_PIN PIN=ACE_Auto_Load VALUE={saved}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=auto_synced VALUE=1
                {% set pin = saved %}
            {% elif pin != saved %}
                SAVE_VARIABLE VARIABLE=ace_auto_load VALUE={pin}
            {% endif %}
            {% set auto_on = (pin == 1) %}
        {% endif %}
        # ---- a print that starts or ends clears the choice made by hand
        {% set ps = printer.print_stats.state %}
        {% set manual = w.manual %}
        {% if w.pstate != ps %}
            {% if (ps in ["printing", "paused"]) != (w.pstate in ["printing", "paused"]) %}
                {% set manual = -2 %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE=-2
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=pstate VALUE='"{ps}"'
        {% endif %}
        # ---- feed assist follows the active tool, only while printing
        {% if w.mode == "idle" %}
            {% set active = printer.toolhead.extruder %}
            {% set tn = 0 if active == "extruder" else active[8:]|int %}
            {% if manual == -2 %}
                {% set want = tn if printing else -1 %}
            {% else %}
                {% set want = manual %}
            {% endif %}
            {% if want != w.assist %}
                {% if w.assist >= 0 %}
                    ACE_DISABLE_FEED_ASSIST T={w.assist}
                {% endif %}
                {% if want >= 0 %}
                    ACE_ENABLE_FEED_ASSIST T={want}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE={want}
            {% endif %}
        {% endif %}
        # ---- auto load when a spool is put in a slot (slot status becomes "ready")
        {% set cur = [] %}
        {% for i in range(4) %}
            {% set _ = cur.append(printer[inst].slots[i].status|string) %}
        {% endfor %}
        {% set prev = w.prev.split(",") if w.prev else [] %}
        {% if w.baselined and auto_on and w.mode == "idle" and w.hold <= 0 and not printing and prev|length == 4 %}
            {% set ns = namespace(go=-1) %}
            {% for i in range(4) %}
                {% if ns.go < 0 and prev[i] != "ready" and cur[i] == "ready" %}
                    {% if not printer["filament_switch_sensor filament" ~ i].filament_detected %}
                        {% set ns.go = i %}
                    {% endif %}
                {% endif %}
            {% endfor %}
            {% if ns.go >= 0 %}
                RESPOND MSG="ACE: spool detected in slot {ns.go + 1}, loading T{ns.go}"
                ACE_WM_LOAD T={ns.go}
            {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=prev VALUE='"{cur|join(",")}"'
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=baselined VALUE=1
        {% if w.hold > 0 and w.mode == "idle" %}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=hold VALUE={w.hold - 1}
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_wm_ace_watch DURATION=1

[gcode_macro ACE_WM_ASSIST]
description: ACE_WM_ASSIST T=0-3 STATE=on|off|toggle - feed assist of one tool by hand. Stays until the next print starts or ends, also while paused
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set st = params.STATE|default("toggle")|lower %}
    {% set w = printer["gcode_macro _WM_ACE"] %}
    {% set inst = "ace_instance_" ~ w.ace_instance %}
    {% if t < 0 or t > 3 %}
        {action_raise_error("ACE_WM_ASSIST: T must be 0 to 3")}
    {% endif %}
    {% if inst not in printer %}
        {action_raise_error("ACE_WM_ASSIST: no ACE found")}
    {% endif %}
    {% if w.mode != "idle" %}
        {action_raise_error("ACE_WM_ASSIST: the ACE is loading or unloading, try again when it is done")}
    {% endif %}
    {% set cur = printer[inst].feed_assist_slot|default(-1)|int %}
    {% set on = (cur != t) if st == "toggle" else (st == "on") %}
    {% if on %}
        {% if cur >= 0 and cur != t %}
            ACE_DISABLE_FEED_ASSIST T={cur}
        {% endif %}
        {% if cur != t %}
            ACE_ENABLE_FEED_ASSIST T={t}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE={t}
        SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE={t}
        RESPOND MSG="ACE: feed assist on for T{t} (by hand)"
    {% else %}
        {% if cur == t %}
            ACE_DISABLE_FEED_ASSIST T={t}
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=manual VALUE=-1
            SET_GCODE_VARIABLE MACRO=_WM_ACE VARIABLE=assist VALUE=-1
        {% endif %}
        RESPOND MSG="ACE: feed assist off for T{t} (by hand)"
    {% endif %}

[gcode_macro ACE_WM_AUTO]
description: ACE_WM_AUTO ENABLE=1|0 - auto load when a spool is inserted
gcode:
    SET_PIN PIN=ACE_Auto_Load VALUE={params.ENABLE|default(1)|int}
    RESPOND MSG="ACE auto-load: {'on' if params.ENABLE|default(1)|int else 'off'}"

# ---------------------------------------------------------------- dryer (Fluidd buttons)
[gcode_macro ACE_WM_DRY_START]
description: Start drying. TEMP (deg C, max 65) and DURATION (same unit as ACE_START_DRYING)
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_START_DRYING INSTANCE={w.ace_instance} TEMP={params.TEMP|default(50)|int} DURATION={params.DURATION|default(240)|int}

[gcode_macro ACE_WM_DRY_STOP]
description: Stop drying
gcode:
    {% set w = printer["gcode_macro _WM_ACE"] %}
    ACE_STOP_DRYING INSTANCE={w.ace_instance}
