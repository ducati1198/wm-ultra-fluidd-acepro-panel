# ============================================================================
# wm_endless.cfg - ENDLESS SPOOL for the WonderMaker ZR Ultra-S   *** EXPERIMENTAL, UNTESTED ***
#
# When a toolhead runs out during a print, WM's own macros pause the print. If another toolhead holds
# the SAME colour and material and is not used by the print, the Fluidd Toolheads card offers
# "Swap & continue", which calls WM_ENDLESS_CONTINUE FROM=<empty head> TO=<spare head>.
#
# Why it is done in several steps: WM's RESUME restores the saved print state (position AND tool offsets)
# of the empty head. After swapping heads that would put the new nozzle at the wrong X/Y/Z offset.
# So this macro (1) restores the saved state with the empty head still on the carriage (this is what a
# normal resume does), (2) reads the print position, hops Z, swaps heads with WM's _CHANGE_TOOL,
# (3) heats + primes + wipes the new head, moves back to the print position using the NEW head's offsets,
# re-saves the PAUSE state there, points the tool mapping (*_backup) at the new head and calls WM's RESUME.
#
# Nothing here changes any WM macro. Off by default (Fluidd switch or WM_ENDLESS_SET ENABLE=1).
# FIRST USE: try on a cheap print, stay at the printer, keep a hand on the stop button.
# ============================================================================

[gcode_macro _WM_ENDLESS]
variable_from: -1
variable_to: -1
variable_px: 0.0
variable_py: 0.0
variable_pz: 0.0
variable_hop: 4.0            # mm Z lift while heads are swapped (increase if unsure)
variable_prime_mm: 20        # mm extruded by the new head before wiping
variable_prime_speed: 300    # mm/min
gcode:

[gcode_macro WM_ENDLESS_SET]
description: WM_ENDLESS_SET ENABLE=1|0 - saved on the printer, read by the Fluidd Toolheads card
gcode:
    {% set e = params.ENABLE|default(0)|int %}
    SAVE_VARIABLE VARIABLE=wm_endless VALUE={e}
    RESPOND MSG="Endless spool: {'on' if e else 'off'}"

[gcode_macro WM_ENDLESS_CHAIN_SET]
description: WM_ENDLESS_CHAIN_SET HEAD=0 CHAIN=2,1 - when head HEAD runs out, take over with head 2, else head 1 (empty CHAIN clears it)
gcode:
    {% set h = params.HEAD|default(-1)|int %}
    {% set ns = namespace(out=[], bad=0) %}
    {% for item in (params.CHAIN|default('')|string).split(',') %}
        {% set v = item|trim %}
        {% if v == '' %}
        {% elif v in ['0','1','2','3'] and v|int != h and v|int not in ns.out %}
            {% set ns.out = ns.out + [v|int] %}
        {% else %}
            {% set ns.bad = 1 %}
        {% endif %}
    {% endfor %}
    {% if h < 0 or h > 3 or ns.bad == 1 %}
        { action_raise_error("WM_ENDLESS_CHAIN_SET: HEAD must be 0-3, CHAIN a list like 2,1 of other heads (no repeats)") }
    {% else %}
        SAVE_VARIABLE VARIABLE=wm_endless_chain{h} VALUE="'{ns.out|join(',')}'"
        RESPOND MSG="Endless spool: head {h} -> {ns.out|join(', ') if ns.out else 'same colour and material'}"
    {% endif %}

[gcode_macro WM_ENDLESS_PLAN]
description: WM_ENDLESS_PLAN FROM= TO= - shows what a swap would do, moves nothing
gcode:
    {% set f = params.FROM|default(-1)|int %}
    {% set t = params.TO|default(-1)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set ns = namespace(logical=[]) %}
    {% for L in range(4) %}
        {% if sv.get('box_modify_t' ~ L ~ '_backup', L)|int == f %}
            {% set ns.logical = ns.logical + [L] %}
        {% endif %}
    {% endfor %}
    RESPOND MSG="Endless spool plan: head {f} -> head {t}; print tools using head {f}: {ns.logical}; head {t} filament: {printer['filament_switch_sensor filament' ~ t].filament_detected if (t >= 0 and t <= 3) else 'n/a'}; print state: {printer.print_stats.state}; on carriage: {sv.get('current_extruder', '?')}"

[gcode_macro WM_ENDLESS_CONTINUE]
description: WM_ENDLESS_CONTINUE FROM= TO= - while PAUSED: swap the empty head FROM for the loaded head TO, purge, resume
gcode:
    {% set f = params.FROM|default(-1)|int %}
    {% set t = params.TO|default(-1)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set ns = namespace(n=0) %}
    {% for L in range(4) %}
        {% if sv.get('box_modify_t' ~ L ~ '_backup', L)|int == f %}
            {% set ns.n = ns.n + 1 %}
        {% endif %}
    {% endfor %}
    {% if printer.print_stats.state != "paused" %}
        {action_raise_error("Endless spool: the print must be paused")}
    {% elif f < 0 or f > 3 or t < 0 or t > 3 or f == t %}
        {action_raise_error("Endless spool: FROM and TO must be two different heads (0-3)")}
    {% elif ns.n == 0 %}
        {action_raise_error("Endless spool: no tool of this print uses head " ~ f)}
    {% elif printer['filament_switch_sensor filament' ~ t].filament_detected != True %}
        {action_raise_error("Endless spool: head " ~ t ~ " has no filament")}
    {% elif sv.get('current_extruder', -1)|int != f %}
        {action_raise_error("Endless spool: head " ~ f ~ " is not the head on the carriage")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=from VALUE={f}
        SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=to VALUE={t}
        RESPOND MSG="Endless spool: head {f} -> head {t}. Returning to the print position first..."
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60
        _WM_ENDLESS_2
    {% endif %}

[gcode_macro _WM_ENDLESS_2]
gcode:
    {% set w = printer["gcode_macro _WM_ENDLESS"] %}
    {% set p = printer.gcode_move.gcode_position %}
    SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=px VALUE={p.x}
    SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=py VALUE={p.y}
    SET_GCODE_VARIABLE MACRO=_WM_ENDLESS VARIABLE=pz VALUE={p.z}
    RESPOND MSG="Endless spool: print position X{p.x|round(2)} Y{p.y|round(2)} Z{p.z|round(2)}; swapping heads"
    G91
    G1 Z{w.hop} F900
    G90
    _CHANGE_TOOL T={w.to}
    _WM_ENDLESS_3

[gcode_macro _WM_ENDLESS_3]
gcode:
    {% set w = printer["gcode_macro _WM_ENDLESS"] %}
    {% set f = w.from %}
    {% set t = w.to %}
    {% set sv = printer.save_variables.variables %}
    {% set temp = printer["gcode_macro RESUME"]["resume_temperature" ~ f]|float %}
    {% if sv.get('current_extruder', -1)|int != t %}
        {action_raise_error("Endless spool: changing to head " ~ t ~ " failed. The print stays paused.")}
    {% elif temp < 150 %}
        {action_raise_error("Endless spool: no valid resume temperature for head " ~ f ~ ". The print stays paused.")}
    {% else %}
        M104 S{temp} T{t}
        M109 S{temp} T{t}
        E_axis_move L={w.prime_mm} S={w.prime_speed}
        WIPE_NOZZLE
        G90
        G1 Z{w.pz + w.hop} F900
        G1 X{w.px} Y{w.py} F6000
        G1 Z{w.pz} F600
        # RESUME heats heads by number and restores the tool mapping from the *_backup variables
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature{t} VALUE={temp}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_temperature{f} VALUE=0
        {% for L in range(4) %}
            {% if sv.get('box_modify_t' ~ L ~ '_backup', L)|int == f %}
                SAVE_VARIABLE VARIABLE=box_modify_t{L}_backup VALUE={t}
            {% endif %}
        {% endfor %}
        SAVE_GCODE_STATE NAME=PAUSE
        RESPOND MSG="Endless spool: continuing the print with head {t}"
        RESUME
    {% endif %}
